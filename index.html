 shower", "he": "", "mean": "מצב שבו משתחררים מספר רב של תסחיפים בבת אחת (למשל קריש גדול שהתפרק לחתיכות קטנות) ויוצרים חסימות רבות בו זמנית באזורים שונים בגוף.", "cmp": ""}, {"id": "c4-45", "en": "Venous embolism", "he": "תסחיף ורידי", "mean": "", "cmp": ""}, {"id": "c4-46", "en": "Arterial embolism", "he": "תסחיף עורקי", "mean": "", "cmp": ""}, {"id": "c4-47", "en": "Infarction", "he": "אוטם", "mean": "חסימה מלאה מהירה ופר-אקוטית של אספקת הדם, וורידית או עורקית.", "cmp": ""}, {"id": "c4-48", "en": "Ischemia", "he": "איסכמיה", "mean": "חוסר אספקת דם לרקמה", "cmp": ""}, {"id": "c4-49", "en": "Hypoxia", "he": "היפוקסיה", "mean": "חוסר אספקת חמצן לרקמה", "cmp": ""}, {"id": "c4-50", "en": "Ischemia-reperfusion injury", "he": "פגיעת איסכמיה-רפרפוזיה (פגיעה עקב חידוש זרימת הדם)", "mean": "פגיעה שנגרמת כשזרימת הדם מתחדשת לרקמה לאחר תקופה של איסכמיה- גורמת לשחרור רדיקלים חופשיים וטוקסינים לדם.", "cmp": ""}, {"id": "c4-51", "en": "Necrosis", "he": "נמק", "mean": "מוות (בלתי הפיך) של תאים או רקמות בגוף חי, כתוצאה מנזק חמור, למשל על רקע איסכמיה, פגיעה רעילה או זיהום.", "cmp": ""}, {"id": "c4-52", "en": "Intussusception", "he": "התשפלות מעי", "mean": "מקטע של המעי חודר (נשאב) לתוך מקטע סמוך של המעי", "cmp": ""}, {"id": "c4-53", "en": "Intestinal torsion", "he": "", "mean": "לולאת מעי מסתובבת סביב ציר האורך של המעי - גורם לחסימה מכנית של המעי ולחסימה של כלי הדם המזינים אותו (איסכמיה של הרקמה).", "cmp": ""}, {"id": "c4-54", "en": "Volvulus", "he": "פתלת המעי", "mean": "לולאת מעי מסתובבת סביב ציר המזנטריום- גורם לחסימה מכנית של המעי ולחסימה של כלי הדם המזינים אותו (איסכמיה של הרקמה).", "cmp": ""}, {"id": "c4-55", "en": "Shock", "he": "הלם", "mean": "קריסה של המע' הקרדיווסקולרית", "cmp": ""}, {"id": "c4-56", "en": "Effective circulating blood volume", "he": "", "mean": "נפח הדם הזמין והמתפקד שמספק פרפוזיה יעילה לרקמות, תלוי גם בנפח וגם בזרימה תקינה.", "cmp": ""}, {"id": "c4-57", "en": "Circulatory shock", "he": "שוק סירקולטורי", "mean": "נובע מבעיה בזרימת הדם (נפח או זרימה).", "cmp": ""}, {"id": "c4-58", "en": "Non-circulatory shock", "he": "שוק לא-סירקולטורי", "mean": "נובע למשל מחסרים מטבוליים או חמצוניים", "cmp": ""}, {"id": "c4-59", "en": "Shock organs", "he": "איברי מטרה רגישים לשוק", "mean": "", "cmp": ""}, {"id": "c4-60", "en": "Hypovolemic", "he": "שוק היפוולמי/ תת-נפחי", "mean": "ירידה בנפח הדם", "cmp": ""}, {"id": "c4-61", "en": "Cardiogenic", "he": "שוק קרדיוגני", "mean": "נפח הדם תקין, משאבת הלב לא מתפקדת", "cmp": ""}, {"id": "c4-62", "en": "Distributive", "he": "שוק דיסטרוביוטיבי / פיזורי", "mean": "אין בעיה ראשונית בלב ונפח הדם תקין, אבל הדם לא מפוזר בצורה הולמת בתוך מחזור הדם", "cmp": ""}]}, {"id": 5, "title": "דלקת (כרונית ואקוטית)", "terms": [{"id": "c5-0", "en": "Inflammation", "he": "דלקת", "mean": "תגובה חיסונית פרוגרסיבית ומבוקרת שנועדה להגן על הגוף מפני גורמים חיצוניים (דוגמת פתוגנים) ופנימיים (דוגמת נאופלזיות). הטריגר העיקרי המוביל ליצירת דלקת הוא נזק ו/או מוות תאי. לצורך קיומה, נדרשת רקמה וסקולרית חיה.", "cmp": ""}, {"id": "c5-1", "en": "Transudate", "he": "נוזל טרנסודט", "mean": "נוזל דליל, שקוף ומימי, עם כמות נמוכה של חלבון ואלמנטים תאיים.", "cmp": ""}, {"id": "c5-2", "en": "Exudate", "he": "נוזל אקסודט", "mean": "נוזל עכור וצמיג לרוב, עם כמות גבוהה של חלבון ו/או תאים (בעיקר לויקוציטים).", "cmp": ""}, {"id": "c5-3", "en": "Vascular endothelial cells", "he": "תאי אנדותל", "mean": "תאים היוצרים את הדופן הפנימית של כלי הדם; משתתפים בוויסות קרישת דם, לחץ דם, אנגיוגנזה ודלקת.", "cmp": ""}, {"id": "c5-4", "en": "Neutrophils", "he": "נויטרופילים", "mean": "תאי הדם הלבנים הראשונים שמגויסים בדלקת אקוטית, ותפקידם לבלוע ולהרוס פתוגנים באמצעות פאגוציטוזה, הפרשת אנזימים ויצירת רשת נויטרופילית חוץ-תאית (NETs).", "cmp": ""}, {"id": "c5-5", "en": "Mast Cells", "he": "תאי מאסט / תאי פיטום", "mean": "תאי \"אזעקה\" המשחררים גרנולות (שמכילות חומרים ואזואקטיביים כדוגמת היסטמין) בתגובה לאלרגנים, פרזיטים וגירויים נוספים.", "cmp": ""}, {"id": "c5-6", "en": "Basophils", "he": "באזופילים", "mean": "תאים הדומים לתאי פיטום, משתתפים בתגובות Hypersensitivity type I ומכילים גרנולות פרו-דלקתיות.", "cmp": ""}, {"id": "c5-7", "en": "Eosinophils", "he": "אאוזינופילים", "mean": "תאים גרנולריים הפועלים בעיקר נגד טפילים ובעת אלרגיה, גורמים בעת פעולתם לנזק רקמתי רב.", "cmp": ""}, {"id": "c5-8", "en": "Natural killer cells (NK)", "he": "תאי הרג טבעי", "mean": "תאים לימפואידיים של מערכת החיסון המולדת שמזהים והורסים תאים נאופלסטיים או תאים הנגועים בנגיף.", "cmp": ""}, {"id": "c5-9", "en": "Monocytes and Macrophages", "he": "מאקרופאגים ומונוציטים", "mean": "מונוציטים בדם שמתמיינים למקרופאגים ברקמות, פועלים ע\"י פאגוציטוזה, הפרשת ציטוקינים והפעלה חיסונית. אלו תאים מונונוקלאריים.", "cmp": ""}, {"id": "c5-10", "en": "Chemical mediators", "he": "מתווכי דלקת", "mean": "חומרים כימיים (כמו ציטוקינים, היסטמין ופרוסטגלנדינים) שמופרשים מתאי דלקת ומשפיעים על כלי דם ועל חדירותם, על תנועת תאים ועל דינמיקת התגובה הדלקתית. הם פועלים במהירות, קצרים בזמן מחצית החיים ומבוקרים על ידי אנזימים או מעכבים פנימיים.", "cmp": ""}, {"id": "c5-11", "en": "Cytokines", "he": "ציטוקינים", "mean": "קבוצת חלבונים המווסתים בין היתר תגובות חיסוניות ודלקתיות. הם משפיעים על ביטוי והתנהגות של תאים אחרים (וכן גם בתהליכי המטופואזה ותגובה חיסונית מולדת ו/או נרכשת).", "cmp": ""}, {"id": "c5-12", "en": "Chemokines", "he": "כימוקינים", "mean": "תת-קבוצה של ציטוקינים שתפקידם העיקרי בדלקת הוא גיוס והכוונת תאי דלקת (לויקוציטים) למוקד הפגיעה באמצעות גרדיאנט כימי.", "cmp": ""}, {"id": "c5-13", "en": "Acute phase proteins", "he": "חלבוני פאזה אקוטיים", "mean": "חלבוני פלזמה המיוצרים בעיקר בכבד בתגובה לציטוקינים (דוגמת TNF ו-IL-1), אשר ריכוזם בדם עולה או יורד בלפחות 25% בזמן דלקת. הם משתתפים בבקרה או בהגברה של התגובה הדלקתית. כוללים לדוגמה את החלבונים CRP, פיברינוגן ואלבומין. משתמשים בהם גם ככלי אבחוני לרמות דלקת.", "cmp": ""}, {"id": "c5-14", "en": "Acute Inflammation", "he": "דלקת אקוטית", "mean": "תגובה דלקתית מהירה שמתרחשת תוך שעות עד ימים, מאופיינת בהצטברות נוזל עשיר בחלבונים (אקסודט) ובחדירה של נויטרופילים לאזור הפגוע. נועדה לנטרל את הגורם המזיק ולהתחיל בתהליך הריפוי במידת הצורך.", "cmp": ""}, {"id": "c5-15", "en": "Acute cystitis", "he": "דלקת אקוטית בשלפוחית השתן", "mean": "דלקת חריפה של שלפוחית השתן המתבטאת במוקוזה אדומה ומבריקה (המורגית והיפרמית), רירית מכויבת ונפוחה אשר הדם נוזל ונשפך ממנה אל הלומן. לכן, בע\"ח חולה יציג בין היתר -Hematuria (שתן דמי), ו- Pollakiuria (תכיפות מוגברת בבמתן שתן).", "cmp": ""}, {"id": "c5-16", "en": "Suppurative bacterial meningitis", "he": "דלקת קרום מוח (מוגלתית)", "mean": "דלקת של קרומי המוח בשלבים הראשוניים לרוב בולטת יותר בחריצים המוחיים (Sulci) ומתפשטת מהם החוצה. כתוצאה מכך, גורמת למופע מוח בצקתי שבו ה-Gyri נפוחים וה-Sulci צרים. התאים הדלקתיים נמצאים ומרחיבים את החלל הסאב-ארכנואידלי.", "cmp": ""}, {"id": "c5-17", "en": "Septic peritonitis", "he": "פריטוניטיס (דלקת קרום הצֶפֶק) ספטי", "mean": "מאופיין בהצטברות נוזלים עתירי פיברין (חומר פיברילרי\\דמוי רשת, דביק, צהוב, אך באותה מידה יכול להיות גם בצבעים אחרים - לבן, ורדרד או אפרפר) בחלל הבטן. הפיברין הזה דולף מכלי הדם הפגועים ועובר פולימריזציה יחסית מהר. סרוזות איברי חלל הבטן עשויות להיופות היפרמיות עם כיבים ודימומים. במקרה שהוצג בכיתה, סביר שהפריטוניטיס נבע מכך שהייתה דליפה ממערכת העיכול.", "cmp": ""}, {"id": "c5-18", "en": "Suppurative keratitis", "he": "קרטיטיס מוגלתי", "mean": "מאופיינת בצבע ירקרק המצביע על תהליך מוגלתי בקרנית העין שנובע בעקבות הסננת נויטרופילים לרקמה. המקור הראשוני לבעיה - כיב קרנית.", "cmp": ""}, {"id": "c5-19", "en": "Eosinophilic myositis", "he": "מיוסיטיס אאוזינופילי", "mean": "דלקת שריר הנחשבת אידיופטית (אך כיום מצטברות עדויות שמדובר בתגובת רגישות יתר לטפיל פרוטוזואלי - Sarcocystis spp), המאופיינת בהסננה דלקתית של אאוזינופילים ובלקויות מולטי-פוקליות בצבע ירקרק ללא גבולות ברורים. בהיסטולוגיה, ניתן לראות כי סיבי השריר המשורטט מופרדים ע\"י אותה הסננה דלקתית של האאוזינופילים.", "cmp": ""}, {"id": "c5-20", "en": "Nercohemorragic myocarditis", "he": "מיוקרדיטיס נקרוהמוראגי", "mean": "מחלה הנקראת גם Black Leg (שחור השוק) ונגרמת ע\"י קלוסטרידיום, חיידק גראם חיובי שמגיע לשרירי השלד ולמיוקרדיום ונותר רדום (כנבג). בעקבות סטרס\\היפוקסיה, החיידק מרים את ראשו ומתחיל לייצר רעלנים הקטלניים לבעל החיים. מחלה שהורגת מהר מאד - מוות פר-אקוטי, ובמרבית המקרים לא תספיק אפילו להיווצר הסננה דלקתית. גם במקרים בהם בעל החיים שרד את ההדבקה הראשונית הוא ככל הנראה ימות, זאת מאחר ששריר לב, בניגוד לשריר שלד, לא יכול לעשות רגנרציה, והצלקות והאינפראקטים (אוטמים) שיוותרו על-גביו יביאו למות בעל החיים. היסטולוגית, ניתן לראות שריר לב המורגי ונמקי.", "cmp": ""}, {"id": "c5-21", "en": "Chronic Inflammation", "he": "דלקת כרונית", "mean": "תגובה דלקתית ממושכת הנמשכת שבועות עד שנים, מתרחשת כאשר הדלקת האקוטית נכשלת, כאשר יש טריגר חוזר ונשנה לדלקת שאיננו מפסיק (וכן בעקבותיו מוסב נזק רקמתי עצמי רב) או כתוצאה מגירוי ייחודי. מאופיינת בהסננת תאים מונונוקלאריים (מקרופגים, לימפוציטים ותאי פלזמה), פיברוזיס, אנגיוגנזה ולעיתים היווצרות גרנולומות.", "cmp": ""}, {"id": "c5-22", "en": "Chronic interstitial nephritis", "he": "-", "mean": "דלקת לימפופלזמציטית (מאופיינת בנוכחות לימפוציטים בעיקר, וכן תאי פלסמה) בכליה שהנה מפושטת, מולטיפוקלית, מתמזגת וחמורה. כלב חולה יגיע עשוי להציג PUPD (שתייה והשתנה מרובים), כך שלעתים כתוצאה ישירה מכך יגיע מיובש או יסבול מאורמיה. כתוצאה מהמחלה, הכליה כושלת במילוי תפקידה - הפרנכימה התקינה שלה נהרסה בהדרגה בעקבות הדלקת. המחלה נפוצה בעיקר בכלבים וחתולים מבוגרים.", "cmp": ""}, {"id": "c5-23", "en": "Chronic pyelonephritis", "he": "-", "mean": "על גבי קפסולת הכליה ניתן לראות אזורים מכווצים ושקועים בעקבות התגובה הדלקתית הכרונית. הם יחסית לבנים ונוקשים, וניתן להניח שמייצגים פיברוזיס (הצטלקות) של הרקמה. בהרבה מהמקרים הדלקת הנה אדיופתית, אך במקרה הזה דווקא יודעים את הפתוגניזה: דלקת עולה באגן הכליה המתפשטת בעיקר לקטבים (= Poles) של הכליה.", "cmp": ""}, {"id": "c5-24", "en": "Inflammatory bowel disease (IBD)", "he": "-", "mean": "דלקת כרונית אדיופטית שמערבת את מערכת העיכול (ברוב המקרים את המעי הדק). מוקוזת המעי בחולה מגורגרת, א-רגולרית ולא תקינה. המחלה מאופיינת בהסננה דלקתית, אשר לרוב מורכבת מלימפוציטים ותאי פלסמה במוקוזת המעי. תאי הדלקת עוטפים את הקריפטים ומביאים ל\"חניקתם\" - מונעים מהם אספקת דם ונוטריינטים, ואלה הולכים ומתים ונושרים ללומן המעי. כתוצאה מאי-חידוש המעי עקב פגיעת הקריפטים, הספיגה נפגעת משמעותית, ולכן המופע של בעל החיים החולה - אשר מתבטא ברזון קיצוני (BCS 1-2 במצבים חמורים).", "cmp": ""}, {"id": "c5-25", "en": "Severity\\degree", "he": "חומרה", "mean": "קל, בינוני, קשה", "cmp": ""}, {"id": "c5-26", "en": "Duration", "he": "משך המחלה", "mean": "פר-אקוטי (דקות-שעות בודדות), אקוטי (ימים בודדים), סב-אקוטי (ימים רבים), כרוני (שבועות-שנים)", "cmp": ""}, {"id": "c5-27", "en": "Distribution", "he": "פיזור", "mean": "מוקדי (focal), רב מוקדי (multifocal), מפושט מקומית [אך לא מערב את כל האיבר] (locally extensive), דיפוזי, Multifocal to coalescing- המוקדים מתמזגים זה עם זה, Disseminated- המון מוקדים קטנטנים, Segmental- אופייני לאיברים צינוריים כמו המעי, כאשר סגמנט אחד של האיבר מעורב בלקות.", "cmp": ""}, {"id": "c5-28", "en": "Type of inflammatory exudate", "he": "סוג האקסודאט הדלקתי", "mean": "סרוטי, מוקואידי (catarrhal), פיברינוטי, מוגלתי, גרנולומטוטי", "cmp": ""}, {"id": "c5-29", "en": "itis (suffix)", "he": "-", "mean": "דלקת", "cmp": ""}, {"id": "c5-30", "en": "osis / opathy (suffix)", "he": "-", "mean": "אבנורמלי, חולה", "cmp": ""}, {"id": "c5-31", "en": "Serous inflammation", "he": "דלקת סרוטית", "mean": "הנוזל טרנסודט - נוזל עני בחלבון ובתאים. מעט תאים דלקתיים, ובעיקר נוזל שקוף וסרוטי, מימי. נראה בצקת בגלל נוזל שדלף (ולעתים גם שלפוחיות), שבחתך היסטולוגי תיראה כמו רווחים בין מרכיבי הרקמה, למשל בין סיבי הקולגן.\nדלקת כזו נקשרת לרוב למחלה קלה, והיא יכולה להופיע בפגיעות תרמיות קלות, באלרגיה ולעתים גם בשלבים הראשוניים של מחלה ויראלית.", "cmp": ""}, {"id": "c5-32", "en": "Catarrhal / Mucoid inflammation", "he": "דלקת מוקואידית", "mean": "ממברנות מוקוזליות מפרישות מוקוס- נוזל סמיך וג'לטיני, עשיר במוצינים. נפגוש בהן באיברים שיש בהם הפרשה נורמלית של מוקוס - מערכת העיכול, נשימה, מין.\nתהיה היפרפלזיה של תאי גביע (Goblet cells) מפרישי מוקוס.\nבגרוס נראה שכבה מוקואידית מבריקה ודביקה, ובהיסטולוגיה חומר אמופרי כחלחל-סגלגל (בזופילי).\nדלקת כזו יכולה להופיע למשל במקרי אלרגיה (כמו אסתמה) או תולעים במערכת העיכול.", "cmp": ""}, {"id": "c5-33", "en": "Fibrinous inflammation", "he": "דלקת פיברינוטית", "mean": "דלקת עם תכולה גבוהה של פיברין מחוץ לכלי הדם, נוזל עם הרבה חלבון ומעט תאים. \nנוכחות הפיברין מחוץ לכלי הדם מעידה על עלייה משמעותית בחדירות (Permeability) שלהם, כך שפיברינוגן (וחלבונים נוספים) מצליח לצאת החוצה ועובר פולימריזציה לפיברין. \nבגרוס נראה חוטי פיברין דביקים ונמתחים או מקבץ של חומר. ניתן לקרוע אותם בקלות, ובכך הם נבדלים מקולגן. זהו לא פיברוזיס!\nבהיסטולוגיה, פיברין ייראה לפעמים פיברילרי ולפעמים אמורפי, וצבעו ורדרד (אאוזינופילי) משום שהוא חלבון.\nדלקת שכזו נפוצה בגורמים זיהומיים ובמיוחד חיידקים (לעיתים גורמים אחרים כמו וירוסים ספציפיים). וירוס FIP בחתולים יגרום לדלקת של כלי הדם (Vasculitis) ולדליפת נוזל בגוון צהבהב-דבש.", "cmp": ""}, {"id": "c5-34", "en": "Purulent / Suppurative inflammation", "he": "דלקת מוגלתית", "mean": "דלקת המאופיינת בדליפת נוזל עשיר בנויטרופילים, קרי מוגלה. הרבה פעמים נגרמת על ידי חיידקים, ולכן בריאות לרוב הפיזור של הלקויות בגרוס יהיה קרניו-ונטרלי, הנובע מחיידקים שנכנסו אירוגנית. אם נסתכל על חתך היסוולוגי של הריאה, נראה חללי נאדיות מלאים בנויטרופילים (במקום באוויר).", "cmp": ""}, {"id": "c5-35", "en": "Granulomatous inflammation", "he": "דלקת גרנולומטוטית", "mean": "אופייני לשחפת ולפטריות ולעיתים טפילים אחרים או גופים זרים. בעיקר מקרופאגים ששופעלו והפכו למקרופאגים אפיתליואידים, כלומר דמויי אפיתל - גדולים עם הרבה ציטופלזמה ובצורת פוליגון. לעיתים אלו מתאחים זה עם זה ויוצרים תאי ענק רב גרעיניים (Multinucleated giant cells). \nתאים דלקתיים נוספים שניתן לראות בכמויות משתנות: לימפוציטים, תאי פלזמה ומונונוקלארים נוספים.\nמרכז הגרנולומה לעתים יהיה נמקי.", "cmp": ""}, {"id": "c5-36", "en": "Necrotizing", "he": "-", "mean": "נמקי", "cmp": ""}, {"id": "c5-37", "en": "Pyo", "he": "-", "mean": "מוגלתי, מאופיין בנוכחות נויטרופילים", "cmp": ""}, {"id": "c5-38", "en": "Hemorrhagic", "he": "המורגי", "mean": "כולל דימומים", "cmp": ""}, {"id": "c5-39", "en": "Ulcerative", "he": "כיבי", "mean": "מכוייב. כיב - חוסר רציפות של משטח אפיתליאלי (לרוב), \"בור\"", "cmp": ""}, {"id": "c5-40", "en": "Erosive", "he": "-", "mean": "סוג של כיב, אך שטחי - מדובר בכיבים שאינם חוצים את הממברנה הבזאלית של האפיתל", "cmp": ""}, {"id": "c5-41", "en": "Fibrosing", "he": "פיברוטי", "mean": "יש פיברוזיס, רקמה צלקתית עם קולגן. יכולה להיות שקועה או בולטת.", "cmp": ""}, {"id": "c5-42", "en": "Proliferative", "he": "פרוליפרטיבי", "mean": "כולל שגשוג והיפרפלזיה של רקמה. אופייני למשל לדלקת מעי עקב Coccidia במעלי גירה קטנים.", "cmp": ""}, {"id": "c5-43", "en": "Hemostasis", "he": "המוסטזיס", "mean": "עצירת דימום בשלב הראשון של תיקון פצעים. נעשה על ידי כיווץ כלי דם (Vasoconstriction), הידבקות ואגרגציה של טסיות למקום הפגוע הפעלת פקטורי קרישה ופולימריזציה של פיברין (= יצירת קריש).", "cmp": ""}, {"id": "c5-44", "en": "Remodeling", "he": "רימודלינג", "mean": "הרס של מה שהיה ובנייה מחדש כדי לחזור כמה שיותר קרוב למצב המקורי לפני הפגיעה - כלומר חזרה למצב בעל התפקוד הטוב ביותר האפשרי.", "cmp": ""}, {"id": "c5-45", "en": "Angiogenesis", "he": "אנגיוגנזה", "mean": "יצירת כלי דם חדשים, לרוב לא יש מאין אלא מתוך כלי דם קיימים. היא קריטית לאספקת דם, חמצן ונוטריינטים ולהגעת תאים חדשים אל המקום בעת הצורך. זהו תהליך המבוקר על ידי ציטוקינים, והוא קורה בדלקות, בהחלמת פצעים או בסרטן. אזורים בעלי אספקת דם גרועה עד לא קיימת (= א-וסקולריים) הם סחוסים וגידים.", "cmp": ""}, {"id": "c5-46", "en": "First intention wound healing", "he": "החלמת פצעים מסוג ראשון", "mean": "החלמה שקורית על ידי רגנרציה בלבד, עם מינימום פיברוזיס בתהליך ושגשוג מועט יחסית עד חסר של כלי דם. הגעה מינימלית של נויטרופילים ומקרופאגים לסילוק פסולת, וחזרה כמעט מושלמת של הרקמה למצב התקין. כדי להגיע להחלמה כזו נרצה לקרב את שפתי החתך זו לזו ככל האפשר כדי שתאי האפיתל יצטרכו לעבור מרחק קטן ככל האפשר בעת הרגנרציה.", "cmp": ""}, {"id": "c5-47", "en": "Second intention wound healing", "he": "החלמת פצעים מסוג שני", "mean": "תהליך ארוך, עם תוצאה פונקציונלית ואסתטית באיכות פחותה. נראה שגשוג נרחב יותר של כלי דם, היווצרות רקמת גרנולציה והיוותרות רקמת צלקת במקום. באיזור הצלקת תהיה שקיעה של הרקמה (הצלקת יכולה גם לבלוט החוצה), שנובעת מכיווץ תאים מיופיברובלסטיים כדי לקרב את שפתי החתך האחת לשנייה. כמובן שבאיזור הצלקת יהיה אובדן פרנכימה, כלומר אובדן רקמה מתפקדת.", "cmp": ""}, {"id": "c5-48", "en": "Granulation tissue", "he": "רקמת גרנולציה", "mean": "שגשוג של כלי דם והגעת פיברובלסטים המייצרים רקמת חיבור וסקולרית ו\"צעירה\".\nהרקמה תהיה ורדרדה משום שהיא עשירה בכלי דם. כלי הדם ברקמת הגרנולציה הם חדשים ולא בנויים בצורה מיטבית, ולכן הם מועדים יותר לדליפות ודימומים. עקרונית מדובר בתהליך תקין וישנה אפשרות ליצירת החלמה על גבי רקמת הגרנולציה, אך במקרים מסוימים הרקמה לא תצליח להפסיק לשגשג ותיצור מסה (Exuberent granulation tissue). בהיסטולוגיה נראה גיאומטריה ייחודית: כלי דם רבים ללא מבנה תקין ופיברובלסטים שיתרבו עם הזמן, כאשר כלי הדם אנכיים לרקמה והפיברובלסטים אנכיים לכלי הדם.", "cmp": ""}, {"id": "c5-49", "en": "Hypertrophic scar", "he": "צלקת היפרטרופית", "mean": "צלקת שיצאה מכלל שליטה. זה אינו תהליך נאופלסטי, כי יש כאן טריגר. המסה הנוצרת יכולה להגיע לגדלים מרשימים וקשה להתמודד איתה כירורגית, כי גם לאחר הסרה היא יכולה לגדול מחדש. בהיסטולוגיה נראה את אותם תאים ומרכיבים שראינו ברקמת גרנולציה - פיברובלסטים וקולגן.", "cmp": ""}, {"id": "c5-50", "en": "Metaplasia", "he": "מטהפלזיה", "mean": "תאים ממוינים מסוג אחד הופכים לתאים ממוינים מסוג אחר. לא מדובר בתהליך נאופלסטי כי התאים עדיין ממוינים. במקרים כאלה, באזורי הלקות (למשל של צלקת שיצאה מכלל שליטה), נראה יצירה של סחוס או עצם למשל באמצע אותן הלקויות.", "cmp": ""}, {"id": "c5-51", "en": "Neoplastic transformation", "he": "נאופלזיה סרטנית", "mean": "דלקת במקרים מסוימים יכולה להתפתח לנאופלזיה ע\"י השריית תנאים מתאימים להתפתחותה.", "cmp": ""}]}, {"id": 6, "title": "אימונופתולוגיה", "terms": [{"id": "c6-0", "en": "Immune system", "he": "מערכת החיסון", "mean": "מערכת שתפקידה להגן על הגוף מפני אנטיגנים מדבקים ומהווצרות סרטן. יכולה לזהות כמעט כל אנטיגן זר.", "cmp": ""}, {"id": "c6-1", "en": "Innate immune", "he": "מערכת החיסון המולדת", "mean": "קו ההגנה הראשון. אינה ספציפית וחסרת זיכרון. מתחילה לפעול בטווח זמן של דקות עד שעות. בעלת שני רכיבים עיקריים- מחסומי הגוף ותגובה דלקתית אקוטית (הומורלית ותאית)", "cmp": ""}, {"id": "c6-2", "en": "Adaptive immunity", "he": "מערכת החיסון הנרכשת", "mean": "קו ההגנה השני. ספציפית ובעלת זיכרון. מתחילה לפעול בטווח של ימים- שבועות. פועלת ע\"י תאי T- תגובה תאית ותאי B- תגובה הומורלית (נוגדנים).", "cmp": ""}, {"id": "c6-3", "en": "PAMP's- pathogen-associated molecular patterns", "he": "", "mean": "מבנים מולקולריים כלליים אותן מערכת החיסון המולדת מזהה בפתוגנים, על מנת לייצר תגובה דלקתית.", "cmp": ""}, {"id": "c6-4", "en": "DAMP's- Damage-Associated Molecular Patterns", "he": "", "mean": "מולקולות שמקורן בתאי המאכסן עצמו, המשתחררות או נחשפות בעקבות נזק תאי או רקמתי לא זיהומי (כמו טראומה, איסכמיה, נקרוזיס, קרינה). הן מזוהות ע\"י מערכת החיסון המולדת כ\"אותות סכנה\", בדומה ל־PAMPs, ומעוררות תגובה דלקתית.", "cmp": ""}, {"id": "c6-5", "en": "PRRs-pattern recognition receptors", "he": "", "mean": "רצפטורים חשובים של מערכת החיסון הנרכשת דרכם מתבצע זיהוי האנטיגנים (PAMPs or DAMPs)", "cmp": ""}, {"id": "c6-6", "en": "MHC- Major histocompatibility complex", "he": "", "mean": "קומפלקס גנים המקודד מולקולות שמעורבות בזיהוי בין תאי ואבחנה בין זר לעצמי. מתחלק שלני סוגים:\nMHC class1- מולקולה המופיעה על כל תא המכיל גרעין.\nMHC class 2- מולקולה המופיעה על תאי APC על מנת להציג אנטיגן להפעלת מערכת החיסון הנרכשת", "cmp": ""}, {"id": "c6-7", "en": "APC- antigen-presenting\ncells", "he": "תאים מציגי אנטיגן", "mean": "תאים המתמחים בהצגת אנטיגנים זרים על גבי MHC class2. \nבתוך התאים האלה נמנים מאקרופאגים, תאי B ותאים דנדריטים.", "cmp": ""}, {"id": "c6-8", "en": "Hypersensitivity reactions", "he": "תגובה ברגישות יתר", "mean": "תגובת מערכת החיסון לאנטיגן, אשר אינה הולמת או לא פרופורצנאלית וגורמת לנזק עצמי לרקמות הגוף. \nמכילה בתוכה 4 תתי סוגים הנשענים על אותו המנגנון. \nכל התגובות האלה מחייבות שלב מקדים של סנסטיזציה עם האנטיגן ורק בחשיפה חוזרת (או ממושכת) יכול להגיע השלב האפקטורי", "cmp": ""}, {"id": "c6-9", "en": "Type I hypersensitivity", "he": "רגישות יתר סוג 1", "mean": "התגובה המהירה ביותר - נראה תוך דקות. מתווכת ע\"י נוגדני IgE.\nשלב חשיפה->יצירת נוגדני IgE הנודדים בזרם הדם ונקשרים לתאי מאסט ברקמות-> בחשיפה הבאה תאי המאסט יגיבו לאנטיגן וישחררו את הגרנולות המכילות בין השאר היסטמין, סרוטונין ואדנוזין-> גיוס תסנין דלקתי ובעיקר אאזנופילי ושינויים וסקולריים: וזודיליטציה (היפרמיה) ובצקת", "cmp": ""}, {"id": "c6-10", "en": "Lichenification", "he": "ליכניפיקציה", "mean": "עיבוי כרוני של העור לרוב עם הדגשה של קפלי העור. נראה למשל ב- Type I hypersensitivity במצב הכרוני.", "cmp": ""}, {"id": "c6-11", "en": "Systemic type I hypersensitivity (Anaphylaxis)", "he": "אנפילקסיס", "mean": "תגובה אקוטית סיסטמית של Type I hypersensitivity. סימנים קליינים (ולקויות) נובעים בעיקר בגלל תגובת כלי הדם והשרירים החלקים.\n הסימנים הקלינים יכולים להשתנות בין מינים שונים אבל התסמינים העיקרים שנראה הם:\n1. בעור - גרד, היפרמיה, בצקת. \n2. כלי הדם והלב - לחץ דם נמוך וטכיקרדיה.\n3. נשימה- דיספנאה כתוצאה מכיווץ ברונכוסים ובצקת בלארינקס.\nהתגובה יכולה להתקדם לשוק אנפילקטי ומוות. \nהגורמים לאנפליקסיס כוללים עקיצת פרוקי רגליים\\הכשות נחש, תרופות מסוימות, חיסונים או תרומות דם וממרכיביו.", "cmp": ""}, {"id": "c6-12", "en": "Anaphylactoid reactions", "he": "אנפלקטואיד", "mean": "תגובות דמויות אנפילקסיס אך לא מתווכות IgE ולכן לא מוגדרות Type I hypersensitivity. הפעלת תאי המאסט היא בעקבות סיבות אחרות.\n(\"Oid\"= דמוי)", "cmp": ""}, {"id": "c6-13", "en": "Type II hypersensitivity", "he": "רגישות יתר סוג 2", "mean": "תגובה שנראה בטווח זמן של שעות. מתווכת ע\"י נוגדנים IgM או IgG. האנטיגנים יכולים להיות עצמיים או זרים אך ספוחים לממברנה תאית בדר\"כ. \nקשירת נוגדן לאנטיגן ספוח->הפעלת מערכת המשלים או תא הרג טבעי -> גיוס תאי דלקת נוספים ולעיתים בליעה ע\"י פגוציטוזה.\nהתגובה לא בהכרח הורסת תאים אלא יכולה לפגוע בפעולתם (Dysfunction) של רצפטורים עצמיים.\nאריתרוציטים נוטים לספוח אל הממברנה שלהם חומרים, ולכן יותר שכיח לראות תגובה כנגדם.", "cmp": ""}, {"id": "c6-14", "en": "Ghost cells", "he": "תאי רוח", "mean": "", "cmp": ""}, {"id": "c6-15", "en": "Myasthenia Gravis", "he": "מיאסניה גרביס", "mean": "מחלה נוירומסקולרית שבה יש קשירת נוגדנים לרצפטורים לאצטיל כולין בצומת עצב-שריר, המפריעים לפעולתם התקינה (הצורה הנרכשת של המחלה). המחלה מתאפיינת בחולשת שרירים פרוגרסיבית המחמירה עם פעילות גופנית.", "cmp": ""}, {"id": "c6-16", "en": "Type III hypersensitivity", "he": "רגישות יתר סוג 3", "mean": "תגובה שנראה בטווח זמן של שעות עד ימים. מתווכת ע\"י הנוגדנים IgG ו-IgM. \nבתגובה זו נוצרים נוגדנים כנגד אנטיגן-> נוצרים קומפלקסים אימוניים-> הקומפלקסים נודדים בזרם הדם -> הקומפלקסים נתקעים ושוקעים באיזורים צרים. כלומר- אין בהכרח נזק לרקמה שבה נוצר הקומפלקס או נוגדנים כנגד הרקמה שבה שקע הקומפלקס. \nנראה את שקיעת הקומפלקסים בעיקר כשיש חשיפה ארוכה בין מערכת החיסון לאנטיגן למשל במקרים של דלקות כרוניות - המערכת נחשפת אליהם כל הזמן וביתר. עיקר הנזק הוא כתוצאה מדלקת הנוצרת באיזור שקיעת הקומפלקסים. \nהמקומות הנפוצים ביותר לשקיעת הקומפלקסים הם הגלומרולי בכליה, מפרקים וכלי דם.", "cmp": ""}, {"id": "c6-17", "en": "Type IV hypersensitivity", "he": "רגישות יתר סוג 4", "mean": "תגובה שנראה בטווח זמן של 24-48 שעות (Delayed-type hypersensitivity (DTH)\n) בגלל שאינה מתווכת ע\"י נוגדנים אלא ע\"י תאים ובפרט לימפוציטים T.\nישנם כמה תתי סוגים לתת רגישות זו אך נתמקד בנפוצה ביותר. \nתאי T helper מפרישים ציטוקינים וגרמים לגיוס מאסיבי של מאקרופגים שליעיתים יצור גרנולומות ע\"מ לבלום את התפשטות הפתוגן.", "cmp": ""}, {"id": "c6-18", "en": "Localized tuberculin response (Mantoux test)", "he": "מבחן טוברקולין", "mean": "לקיחת חלבון אנטיגני מהחיידק-> הזרקה תת עורית באיזור היד-> מחכים 72 שעות-> במידה ונוצרה תגובה דלקתית המערבת מאקרופאגים בריכוז גבוה ניתן להגיד שזו לא החשיפה הראשונה של הנבדק לאנטיגן -> ככל הנראה הנבדק נחשף בעבר לחיידק השחפת.", "cmp": ""}, {"id": "c6-19", "en": "Granulomatous inflammation", "he": "דלקת גרנומלוטית", "mean": "סוג של דלקת כרונית (ראה מושג בפרק 5)", "cmp": ""}, {"id": "c6-20", "en": "Pyogranulomatous inflammation", "he": "דלקת פיוגנולומטוטית", "mean": "דלקת כרונית המאופיינת גם בתסנין דלקתי גרנולומטוטי (תאים מונונוקלארים), אך גם נויטרופילים (Pyo=מוגלה).", "cmp": ""}, {"id": "c6-21", "en": "Cytokine-related diseases", "he": "מחלות קשורות ציטוקינים", "mean": "מחלות הקשורות בהפרשה לא תקינה של ציטוקינים", "cmp": ""}, {"id": "c6-22", "en": "Superantigens", "he": "סופר-אנטיגן", "mean": "אנטיגנים הגורמים להפעלה מסיבית, לא נכונה ולא ספציפית של מערכת החיסון (בפרט הפעלה מסיבית של תאי T).", "cmp": ""}, {"id": "c6-23", "en": "Transplant rejection", "he": "דחיית רקמות", "mean": "דחיית רקמות שתל בעיקבות זיהוי כרקמה זרה על ידי מערכת החיסון. \nיכול להיות במנגנון ישיר או עקיף", "cmp": ""}, {"id": "c6-24", "en": "Autoimmune diseases", "he": "תגובה אוטואמיונית", "mean": "תגובה ספציפית כנגד אנטיגן עצמי (Self antigen). אובדן הסבילות האימונולוגית (פריפרית או מרכזית) הגורמת ליצירת נוגדנים או תאי T ראקטיבים כנגד העצמי. יכול להיות סיסטמי או מקומי. מקור הבעיה לרוב משלב גורמים רבים - סביבתיים וגנטים כשלא ניתן לדעת את מקור הבעיה הראשוני. \nבמחלות רבות, נראה את הסימנים הקליניים באופן ציקלי- עולים ויורדים (אפיזודות של החמרה והטבה). \nקשה מאוד לאבחון ודאי בעולם הוטרינרי, ובמקרים רבים האבחנה היא טנטיבית.", "cmp": ""}, {"id": "c6-25", "en": "Immunologic tolerance", "he": "סבילות במערכת החיסון", "mean": "תהליך אקטיבי בו נמנעת או מדוכאת תגובה חיסונית כנגד אנטיגנים. \nסבילות חיסונית יכולה להיות מרכזית (תימוס ומח עצם) או פריפרית, באמצעות מחיקת תאי T ו-B עצמיים, אנרגיה (anergy) או פעילות תאי T רגולטוריים.", "cmp": ""}, {"id": "c6-26", "en": "Immune Privilege", "he": "פריבילגיה חיסונית", "mean": "איזורים בגוף בהם מערכת החיסון מדוכאת באופן פיזיולוגי (נורמלי)- למשל אין להם כלי לימפה, יש מחסום (Barrier) בין הדם לרקמה, יש מיעוט ציטוקינים ומעט תאי APC. \nהאיברים העיקריים הם - מערכת העצבים, עין והאשכים", "cmp": ""}, {"id": "c6-27", "en": "Sequestered Antigens", "he": "אנטיגנים מוחבאים", "mean": "אנטיגנים שאינם נחשפים למערכת החיסון במהלך ההתפתחות העוברית ולכן מערכת החיסון אינה מפתחת סבילות חיסונית נגדם. \nנמצאים במקומות בהם יש Immune Privilege", "cmp": ""}, {"id": "c6-28", "en": "Systemic Lupus Erythematosus - SLE", "he": "זאבת", "mean": "מחלה אוטואמיונית כרונית ורב מערכתית. קשה להוכחה בוטרינריה. נפוצה בדר\"כ בגילאי הביניים. הפתוגנזה אינה יודעה, רק שיש שבירה של הסבילות לעצמי. \nנוצרים נוגדנים כנגד מרכיבים רקמתיים שונים שהדומיננטי ביותר הוא כנגד מרכיבים המצויים בגרעיני התאים (מדידת נוגדנים גרעיניים- Anti-nuclear antibodies מהווה מרכיב באבחון המחלה, אך הדיוק אינו גבוה במיוחד. )\nמנגנון המחלה הוא Type III hypersensitivity ולכן עיקר הפגיעה שנראה היא באיברים: כליות, כלי הדם ומפרקים.\nצורות עוריות מקומיות (לא Systemic) יותר נפוצות בוטרינריה - Cutaneous lupus erythematosus.", "cmp": ""}, {"id": "c6-29", "en": "Pemphigus complex", "he": "פמפיגוס", "mean": "מחלה שבה נוצרים נוגדנים כנגד הדזמוזומים המחברים בין תאי האפיתל באפדירמיס העור ו\\או ריריות. מנגנון המחלה הוא Type II hypersensitivity. \nיכול לקרות כתוצאה מקרינה, נאופלזיה או תרופות מסויימות או אידיופתי. גזע הצ'או צ'או בעל נטיית קדם (Predisposition). \nב-Gross, לרוב נצפה ללקויות בי לטראליות סימטריות המאופינות בהיווצרות שלפוחיות גדולות (bullae) וקטנות (vesicles) שלעיתים מזדהמות ולכן נראה גם מוגלה (Postules) או התכייבות (Erosions and ulcers),היווצרות קראסטים או קשקשת. לקויות יהיו מקומיות או מפושטות ולעיתים זה יגיע עם סימנים קלינים סיסטמיים: חום , חוסר תאבון (אנורקסיה), חולשה והגדלת של קשרי הלימפה. \nהמיקום (עור או ריריות) והחומרה (עומק הלקויות) נקבעת לפי האנטיגנים כנגדם נוצרים הנוגדנים, ובהתאמה כנגד אלו דזמוזמים הם מגיבים - אם זה לאנטיגנים המצויים רק בדזמוזומים שטחיים אז החומרה חלשה (פרוגנוזה טובה יותר), אך אם זה נגד אנטיגנים בדזמוזומים עמוקים יותר או שמצויים בריריות, החומרה תהיה קשה יותר.", "cmp": ""}, {"id": "c6-30", "en": "Erosion", "he": "אירוזיה", "mean": "פגיעה שטחית באפיתל אשר אינה חודרת את הממברנה הבאזלית (כיבים שטחיים).", "cmp": ""}, {"id": "c6-31", "en": "Crust", "he": "גלד", "mean": "משקעים\\הפרשות יבשות הדבוקים לעור. הרכבם (ולכן גם המורפולוגיה שלהם) יכול להשתנות ולכלול בין היתר דם, סרום, תאי מערכת חיסון (מוגלה שהתייבשה), תאים נמקיים, קרטין וכו'.", "cmp": ""}, {"id": "c6-32", "en": "Pemphigus Foliaceus", "he": "פמפיגוס פוליאצאוס", "mean": "המופע הקל יותר של פמפיגוס. הלקויות הן בי לטראליות סימטריות בעיקר באיזור הפנים, אפרכסות האוזניים וכפות הרגליים. \nלא רואים שלפוחיות (כיוון שמתפוצצות מהר) אלא יותר קראסטים ואלופציה. \nבהיסטולגיה נראה כמה דברים:\n1. Cleft- חריץ שנוצר כתוצאה מהתנתקות התאים מתחת לשכבת הקרטין (Sub-corneal).\n2. בהגדלה נראה תאים אקאנטוליטים - תאי אפיתל שאיבדו את צורתם והפכו לעגולים כתוצאה מאובדן החיבורים בין תאיים (דזמוזומים).", "cmp": ""}, {"id": "c6-33", "en": "Pemphigus vulgaris", "he": "פמפיגוס וולגריס", "mean": "המופע הקשה יותר של פמפיגוס. משפיע גם על העור אך גם על ריריות. \nנראה את הCleft באיזורים עמוקים יותר - בשכבת Suprabasal, ולא נראה תאים אקאנטוליטים.", "cmp": ""}, {"id": "c6-34", "en": "Immunodeficiencies", "he": "דיכוי חיסוני", "mean": "מערכת החיסון נכשלת בהגנה על העצמי כנגד פתוגנים או נאופלזיה. הדיכוי יכול להיות:\n1. ראשוני- גנטי או מולד. בגורים בגלל הנוגדנים האמהיים, לעיתים נראה את הכשל רק לאחר ירידת רמות הנוגדנים האימהיים בדם (לאחר מספר שבועות).\n2. שניוני- נרכש במהלך החיים מסיבות שונות כמו גיל, תרופות מדכאות מערכת חיסון, וירוסים, חסרים תזונתיים, קרינה או כימותרפיה. \nמחלות דיכוי חיסוני רבות, עוד לא אופיינו באופן מייטבי בתחום הוטרינריה.", "cmp": ""}]}, {"id": 7, "title": "מחלות והפרעות התפתחותיות", "terms": [{"id": "c7-0", "en": "Multifactorial diseases", "he": "מחלות התלויות במספר גורמים", "mean": "מחלות התלויות במספר גורמים (יותר מגורם ראשוני אחד).", "cmp": ""}, {"id": "c7-1", "en": "Aplasia", "he": "אפלזיה", "mean": "חוסר מוחלט בהתפתחות של איבר או רקמה. אין רקמה מתפקדת כלל.", "cmp": ""}, {"id": "c7-2", "en": "Agenesis", "he": "אג'נסיס", "mean": "לרוב בשימוש כמילה נרדפת לאפלזיה (אך בפועל יש הבדל מסוים בין המושגים) – לא רק שהאיבר לא התפתח אלא גם הרקמה העוברית (פרימורדיום), ממנה האיבר אמור היה להתפתח, חסרה.", "cmp": ""}, {"id": "c7-3", "en": "Hematopoietic tissue", "he": "רקמה המטופואטית", "mean": "רקמה שאחראית על ייצור תאי דם (אדומים, לבנים וטסיות דם). קיימת בעיקר במח העצם ביונקים. בהיסטולוגיה של מח עצם תקין, נצפה לראות רקמה המטופואטית פעילה.", "cmp": ""}, {"id": "c7-4", "en": "Aplastic anemia", "he": "אנמיה אפלסטית", "mean": "מצב שבו מח העצם אינו מייצר תאי דם. מח העצם מאבד את יכולת הייצור שלו בגלל פגיעה\\העדר בתאי הגזע המטופואטיים.", "cmp": ""}, {"id": "c7-5", "en": "Segmental Aplasia", "he": "אפלזיה סגמנטלית", "mean": "חסר של מקטע מסוים באיבר או רקמה - כלומר, חלק מהרקמה או מהאיבר לא נוצר. לא מדובר בהקטנה או תת-התפתחות של האיבר כולו אלא בהיעדר מקטע ספציפי בו.", "cmp": "*הערה- אפלזיה סגמנטלית ואטרזיה הם מושגים דומים מאוד פעמים רבות משתמשים בהם כמילים נרדפות. אם נרצה לדייק, ישנם הבדלים עדינים בין המושגים, למשל ב-Segmental aplasia אפשר להשתמש גם לאיברים שאינם צינוריים (ללא לומן)."}, {"id": "c7-6", "en": "Atresia", "he": "אטרזיה", "mean": "מצב של חסימה מוחלטת או הצרות של מקטע בצינור או באיבר צינורי חלול (כגון מערכת העיכול, מערכת הנשימה מערכת המין כו) כתוצאה מהתפתחות לא תקינה של אותו האיבר בתקופת ההתפתחות העוברית. מדובר בהפרעה מולדת, ולא ברקמה שנחסמה עקב תהליך נרכש כמו דלקת, גידול או טראומה. החסימה מתבטאת בהיעדר מוחלט של לומן במקטע מסוים, ולעיתים גם בהיעדרו של מקטע שלם מהאיבר.", "cmp": ""}, {"id": "c7-7", "en": "Megacolon", "he": "מגה קולון", "mean": "התרחבות חמורה של הקולון, לרוב עקב חסימה כרונית או פגיעה בעצבוב של המעי\\פריסטלטיקה (ישנם גורמים נוספים). בשונה מאטרזיה, במקרים רבים מדובר במצב נרכש – כלומר שאינו מולד.", "cmp": ""}, {"id": "c7-8", "en": "Hypoplasia", "he": "היפופלזיה", "mean": "מצב שבו איבר מתפתח, אך באופן חלקי – כלומר, האיבר קיים אך לא הגיע לגודלו התקין. (‫הרבה פעמים תתבטא ‫בפעילות ירודה יותר של האיבר, אך ‫יכול להיות שלא יהיו סימנים קליניים (תת-קליני), עקב רזרבה תפקודית ו\\או היפרטרופיה של האיבר הקונטרלטרלי (כליות לדוגמא).\n\nבהיסטולוגיה- נראה כמות מופחתת של תאים פרנכימתיים (תאי תפקוד עיקריים של האיבר), כגון ירידה במספר הנפרונים בכליה או הפטוציטים בכבד. בניגוד לאטרופיה, שבה האיבר היה פעם בגודל תקין ונסוג, בהיפופלזיה הוא מעולם לא התפתח לגודל הנורמלי.", "cmp": ""}, {"id": "c7-9", "en": "BAOS – Brachycephalic Airway Obstructive Syndrome", "he": "תסמונת חסימתית של דרכי הנשימה בכלבים פחוסים", "mean": "תסמונת מולדת הנפוצה בכלבים ברכיצפאליים (בולדוג אנגלי, פאג, בוקסר ועוד), שמאופיינת במספר שינויים אנטומיים בדרכי הנשימה העליונות – . השינויים כוללים היפופלזיה של קנה הנשימה (tracheal hypoplasia), נחיריים מוצרים (stenotic nares), חך רך מוארך (elongated soft palate) ולעיתים גם ל everted laryngeal saccules.*** ישנם שינויים נוספים שלא הוזכרו בכיתה.", "cmp": ""}, {"id": "c7-10", "en": "EPI – Exocrine Pancreatic Insufficiency\n\nJuvenile Pancreatic Atrophy", "he": "אי ספיקה של הלבלב האקסוקריני", "mean": "מצב בו הלבלב אינו מפריש מספיק אנזימי עיכול אל תוך המעי הדק, מה שמוביל לירידה משמעותית בעיכול המזון וכתוצאה מכך לשלשולים, חוסר עלייה במשקל (גור שלא מתפתח ברמה דומה לאחיו לשגר), הקאות וחולשה.\n\nהגורם לרוב הוא אטרופיה (כלומר הלבלב התפתח ונסוג) של הלבלב האקסוקריני – במיוחד בכלבים צעירים .", "cmp": ""}, {"id": "c7-11", "en": "Atrophy", "he": "אטרופיה", "mean": "מצב שבו איבר התפתח באופן תקין והגיע לגודלו (ותפקודו) התקין, אך לאחר מכן חלה נסיגה בגודל (ותפקוד), לרוב עקב אובדן תאים או פעילות (שונה מהיפופלזיה – שם האיבר מעולם לא הגיע לגודל התקין).", "cmp": ""}, {"id": "c7-12", "en": "Dysplasia", "he": "דיספלזיה (התפתחותית)", "mean": "דיספלזיה היא בעיה התפתחותית המתבטאת במבנה לא תקין של איבר, ללא קשר הכרחי להקטנה בנפח או במסה שלו (אף שאלה עשויות להתלוות לכך). ברבים מהמקרים, שינוי מבני מוביל לבעיה פונקציונלית של האיבר, שמתבטאת לעיתים כבר בהמלטה ולעיתים בשלבים מאוחרים יותר.", "cmp": ""}, {"id": "c7-13", "en": "Skeletal dysplasia", "he": "דיספלזיה של השלד", "mean": "קבוצת הפרעות התפתחותיות הפוגעות במבנה התקין של מערכת השלד – עצמות, עמוד שדרה וכו'. הפרעה זו גורמת לעיוותים, בצורה ובארגון המבני של השלד, ולעיתים משפיעה גם על תפקוד.", "cmp": ""}, {"id": "c7-14", "en": "Hip dysplasia", "he": "דיספלזה של מפרק הירך", "mean": "מחלה נפוצה בכלבים מגזעים גדולים ולעיתים גם בחתולים. מתבטאת בהתפתחות לא תקינה של מבנה מפרק הירך (מבנה אבנורמלי), שגורמת לכך שמופעלים עומסים גדולות יותר על המפרק, להפרעה ביומכנית, כאב, צליעה ולבסוף – לשינויים ניווניים במפרק.", "cmp": ""}, {"id": "c7-15", "en": "Scottish fold \nosteochondrodysplasia (SFOCD)", "he": "אוסטאוכונדרודיספלזיה", "mean": "מחלה תורשתית בחתולים מגזע סקוטיש פולד שנגרמה בעקבות טיפוח תכונת האוזניים המקופלות (Microtic ears). הפגם אינו רק באוזניים, אלא מלווה גם בשינויים במפרקים אחרים - זנב, כפות רגליים וכו'.\n\nמדובר בפגם בהתפתחות תקינה של הסחוס, ככל הנראה על רקע אוטוזומלי דומיננטי עם חדירות חלקית. כלומר, לא כל הפרטים יראו את כלל הסימנים הקליניים. החתולים עלולים לסבול מכאבי מפרקים בשל התפתחות לא תקינה של הסחוס.", "cmp": ""}, {"id": "c7-16", "en": "Collagen Dysplasia", "he": "דיספלזיה של קולגן העור", "mean": "ידועה גם כ-Ehlers-Danlos Syndrome, Cutaneous Asthenia ו-Dermatosparaxis. זוהי הפרעה מבנית בקולגן הדרמלי – וכתוצאה מכך – העור רפוי, נמתח בקלות, אך גם פגיע ביותר לפציעות.", "cmp": ""}, {"id": "c7-17", "en": "Ectopia", "he": "אקטופיה", "mean": "הופעת איבר או רקמה (תקינה מבנית או לא), במיקום אנטומי לא תקין. זהו מצב התפתחותי בו האיבר אינו במקומו, ועלול לפגוע בתפקוד. באופן תאורטי, לכל איבר או רקמה יש פוטנציה להיות אקטופים, אך בפועל ישנם איברים\\רקמות שבהם הפרעה זו נפוצה יותר.", "cmp": ""}, {"id": "c7-18", "en": "Duplication", "he": "דופליקציה", "mean": "מצב שבו יש שכפול של איבר – מעבר למספר הרגיל. נחשב להפרעה התפתחותית.", "cmp": ""}, {"id": "c7-19", "en": "", "he": "ציסטה אמיתית", "mean": "ציסטה היא מבנה דמוי שק המכיל נוזל (בדרך כלל נוזל צלול) ומדופן על ידי אפיתל חד שכבתי, שטוח עד קובייתי.", "cmp": ""}, {"id": "c7-20", "en": "Pseudocyst", "he": "ציסטה מדומה", "mean": "ציסטה שאיננה מדופנת על ידי אפיתל אלא על ידי רקמה אחרת- בדרך כלל מדופנת על ידי רקמת חיבור קולגנית או רקמת גרנולציה (לדוגמא היווצרות Pancreatic pseudocyst בדלקת לבלב). (לא נעסוק בה)\n\nהרוב המכריע של הציסטות המדומות הן נרכשות ולא מולדות.", "cmp": ""}, {"id": "c7-21", "en": "", "he": "ציסטות מולדות", "mean": "בדרך כלל מוגדרות היטב, כלומר קל להפרידן מהרקמה השכנה. הן יכולות להיות בודדות או מרובות, והגודל יכול להגיע למימדים יחסית גדולים. לפעמים יש ציסטה אחת שיש לה מחיצות, כלומר Septation שהיא מחולקת למספר תאים קטנים יותר. לרוב, לציסטה יש התנהגות שהיא שפירה, וללא השפעה על בעל החיים. הציסטה יכולה לעבור רגרסיה ולהעלם בבעלי חיים בוגרים. במקרים נדירים היא יכולה ליצור בעיות (לדוגמא- ציסטה הלוחצת על מבנה צמוד).", "cmp": "הסיווג ביניהן נוגע למועד ההתפתחות של הציסטה (ובעקיפין גם למנגנון ההיווצרות).\n\nציסטה מולדת לרוב נגרמת עקב הפרעה\\פגם התפתחותי, לעומת ציסטה נרכשת שנוצרת משנית לנזק רקמתי/דלקת/נמק וכדומה. לדוגמא, חסימה של נפרונים עקב דלקת כלייתית עלולה לגרום ליצירת ציסטות נרכשות לרוב בקורטקס הכליות."}, {"id": "c7-22", "en": "", "he": "ציסטה נרכשת", "mean": "חלק מהן יכולות ליצור בעיות, לדוגמה על ידי הפרשת הורמונים (ציסטות בשחלה המפרישות פרוגסטרון או אסטרוגן), ציסטות שנוצרות על ידי גידולים נאופלסטיים או ע\"י פרזיטים שונים (ציסטות פרזיטריות יחסית נפוצות בחיות משק, אך לא רק) וציסטות מדומות. \n\nהנוזל בציסטה לא בהכרח צלול.", "cmp": ""}]}, {"id": 8, "title": "נאופלזיה", "terms": [{"id": "c8-0", "en": "Neoplasia", "he": "נאופלזיה", "mean": "פרוליפרציה בלתי מבוקרת/אבנורמלית (פתולוגית) של תאים ורקמות הנובעת בעיקרה ממוטציות סומטיות בגנום התאי", "cmp": ""}, {"id": "c8-1", "en": "Benign", "he": "גידול שפיר", "mean": "גידול שאינו מתפשט לרקמות אחרות", "cmp": ""}, {"id": "c8-2", "en": "Malignant", "he": "גידול ממאיר (סרטן)", "mean": "גידול שיכול להתפשט לרקמות אחרות סמוכות אנטומית (Invasiom) ו\\או רחוקות (Metastasis)", "cmp": ""}, {"id": "c8-3", "en": "Tumor", "he": "גידול", "mean": "נפיחות- כל מסה, יכולה להיות נאופלסטית או לא", "cmp": ""}, {"id": "c8-4", "en": "Carcinogenesis", "he": "קרצינוגנזה", "mean": "תהליך היווצרות נאופלזיות", "cmp": ""}, {"id": "c8-5", "en": "Driver mutations", "he": "מוטציות מניעות", "mean": "מוטציות שיעודדו היווצרות נאופלזיות", "cmp": ""}, {"id": "c8-6", "en": "Passenger mutations", "he": "מוטציות נלוות", "mean": "מוטציות המצטברות בתאים נאופלסטיים אך אינן תורמות להיווצרות נאופלזיות (Carcinogenesis)", "cmp": ""}, {"id": "c8-7", "en": "Gain of function mutation", "he": "", "mean": "מוטציה שמגבירה את הביטוי של גן", "cmp": ""}, {"id": "c8-8", "en": "Loss of function mutation", "he": "", "mean": "מוטציה שמפחיתה את הביטוי של גן", "cmp": ""}, {"id": "c8-9", "en": "Neoplastic transformation", "he": "שינוי נאופלסטי", "mean": "התהליך בו תאים הופכים לנאופלסטיים", "cmp": ""}, {"id": "c8-10", "en": "Gene TP53", "he": "", "mean": "מבקר חלוקות תאים ומדכא נאופלזיות", "cmp": ""}, {"id": "c8-11", "en": "Telomerase", "he": "טלומראז", "mean": "מאריך את הטלומרים ומשמר את יכולת התא להתחלק", "cmp": ""}, {"id": "c8-12", "en": "Primary neoplasm", "he": "גידול ראשוני", "mean": "גידול שגדל ברקמה או באיבר באופן התחלתי", "cmp": ""}, {"id": "c8-13", "en": "Secondary neoplasm", "he": "גידול שניוני", "mean": "גידול שהתפשט למקומו האנטומי הנוכחי, ממקום אחר סמוך (מפלישה מקומית) או מרוחק (גרורה).", "cmp": ""}, {"id": "c8-14", "en": "Genomic instability", "he": "אי יציבות גנומית", "mean": "נטייה מוגברת להיווצרות מוטציות בגנום התא", "cmp": ""}, {"id": "c8-15", "en": "Somatic hyper-mutation", "he": "", "mean": "תהליך שבו לימפוציטים עוברים מוטציות מכוונות בגן של הנוגדן כדי לשפר את זיהוי האנטיגן", "cmp": ""}, {"id": "c8-16", "en": "Angiogenesis / neovasculatizion", "he": "אנגיוגנזה / נאו-וסקולריזציה", "mean": "תהליך יצירת כלי דם חדשים", "cmp": ""}, {"id": "c8-17", "en": "VEGF (Vascular endothelial growth factor)", "he": "", "mean": "פקטור שאחראי על ייצור כלי דם. בין היתר תאים נאופלסטיים גורמים להפרשתו בכדיי לעודד יצור כלי דם המזינים את הגידול.", "cmp": ""}, {"id": "c8-18", "en": "Precursor lesions", "he": "נגעים קדם-ממאירים", "mean": "שינויים רקמתיים כגון היפרפלזיה, מטפלזיה או דיספלזיה, המהווים פרה-דיספוזציה להתפתחות תהליכים נאופלסטיים, אך עדיין אינם סרטניים.", "cmp": ""}, {"id": "c8-19", "en": "Carcinogen", "he": "קרצינוגן", "mean": "כל חומר חיצוני שגורם להתפתחות נאופלזיות", "cmp": ""}, {"id": "c8-20", "en": "Mutagen", "he": "מוטגן", "mean": "חומר הגורם למוטציות ב-DNA", "cmp": ""}, {"id": "c8-21", "en": "Suffix - \"oma\"", "he": "סיומת oma", "mean": "עבור גידול אפיתליאלי שפיר (יש יוצאים מן הכלל כמו לימפומה ומלנומה)", "cmp": ""}, {"id": "c8-22", "en": "Carcinoma", "he": "סיומת קרצינומה", "mean": "עבור גידול אפיתליאלי ממאיר", "cmp": ""}, {"id": "c8-23", "en": "Carcinoma in situ", "he": "", "mean": "דיספל , "cmp": ""}, {"id": "c8-96", "en": "Canine cutaneous mast cell tumor (MCT)", "he": "גידול תאי מאסט עורי", "mean": "גידול של תאי מאסט, הגידול העורי הממאיר הנפוץ ביותר בכלבים.", "cmp": ""}, {"id": "c8-97", "en": "Staging", "he": "-", "mean": "זהו מושג קליני ולא היסטולוגי המתאר את דרגת ההתפשטות בפועל, ולא בפוטנציאל, של הגידול בגוף.", "cmp": ""}, {"id": "c8-98", "en": "Histologic margins", "he": "", "mean": "השוליים של הרקמה שנכרתה בניתוח, כפי שהם נבדקים תחת מיקרוסקופ כדי להעריך האם הגידול הוסר במלואו או שנותרו תאים גידוליים בגוף.", "cmp": ""}, {"id": "c8-99", "en": "Incisional biopsy", "he": "-", "mean": "ביופסיה שבה דוגמים רק חתיכה מהגידול ולא מוציאים את כולו החוצה (פרוצדורה דיאגנוסטית ולא טיפולית)", "cmp": ""}, {"id": "c8-100", "en": "Excisional biopsy", "he": "-", "mean": "ביופסיה שבה מוציאים החוצה את כל הגידול, לרוב עם שוליים של רקמה תקינה.", "cmp": ""}, {"id": "c8-101", "en": "Histological tumor free margins (HTFM)", "he": "-", "mean": "המרחק של התאים הנאופלסטיים משולי החתך ההיסטולוגי.", "cmp": ""}, {"id": "c8-102", "en": "Non-diagnostic sample", "he": "דגימה לא דיאגנוסטית", "mean": "דגימה שלא ניתן להסיק ממנה מסקנות אבחנתיות", "cmp": ""}]}, {"id": 9, "title": "שיטות דיאגנוסטיות", "terms": [{"id": "c9-0", "en": "Cytology", "he": "ציטולוגיה", "mean": "שיטה שגרתית המשמשת לבדיקת נגעים במגוון רחב של רקמות. \nבשיטה זו בוחנים תאים שלמים (ולא חתך דרך תאים) ולכן ניתן לזהות פרטים מורפולוגיים עדינים שלא רואים בהיסטולוגיה (מאפייני הציטופלסמה, גרעינונים, פיזור כרומטין וכדומה). \nמאידך, לא רואים ארכיטקטורה של רקמה (לדוגמא, לא ניתן להעריך פולשנות בניאופלזיות).", "cmp": ""}, {"id": "c9-1", "en": "FNA- Fine Needle Aspiration", "he": "", "mean": "הכנסת מחט (מחוברת למזרק או לא) למסה או רקמה ושאיבת תאים החוצה. את הדגימה משפריצים על סלייד.", "cmp": ""}, {"id": "c9-2", "en": "Impression smear", "he": "משטח מגע", "mean": "דרך נוספת ללקיחת דגימת רקמה, ע\"י טפיחה של חלק ממסה על סלייד", "cmp": ""}, {"id": "c9-3", "en": "Vaginal smear", "he": "משטח וגינלי", "mean": "לקיחת דגימה מהוגינה בעזרת מטוש והנחה על סלייד", "cmp": ""}, {"id": "c9-4", "en": "Blood smear", "he": "משטח דם", "mean": "משטח דם", "cmp": ""}, {"id": "c9-5", "en": "Histochemistry", "he": "היסטוכימיה", "mean": "\"היסטו\" = רקמה, צביעות היסטולוגיות ללא שימוש בנוגדנים, אשר לרוב אפשרות זיהוי מאפיינים (מרכיבים תאיים\\חוץ תאיים) שלא נצבעים טוב בצביעת H&E רגילה, או שקשה לזהותם באופן ספציפי (להבדילם מאחרים).", "cmp": ""}, {"id": "c9-6", "en": "Mason trichrome", "he": "", "mean": "מדגישה קולגן בצבע כחול, מאפשרת כימות קולגן ברקמה.", "cmp": ""}, {"id": "c9-7", "en": "Periodic Acid Shiff - PAS", "he": "", "mean": "צובעת סוכרים מורכבים (פוליסכרידים\\מוקופוליסכרידים) כמו גליקוגן בצבע מג'נטה (ורוד בוהק). \nמשמשת למשל להדגשת ממברנות בזאליות (BM), זיהוי פטריות (צובע את הקפסולה), מחלות אגירת גליקוגן וכו'.", "cmp": ""}, {"id": "c9-8", "en": "Gomori's Methenamine Silver - GMS", "he": "", "mean": "צביעת פטריות, אצות וטפילים אחרים בצבע שחור.", "cmp": ""}, {"id": "c9-9", "en": "Gram stain", "he": "", "mean": "מפרידה בין חיידקים גראם חיוביים שיצבעו סגול לבין גראם שליליים שייצבעו באדום, על סמך דופן התא.", "cmp": ""}, {"id": "c9-10", "en": "Acid fast (ziehl- neelsen)", "he": "", "mean": "מאפשרת זיהוי אורגניזמים שונים כמו חיידקי מיקובקטריום (לכן מכונים חיידקים יציבי חומצה)", "cmp": ""}, {"id": "c9-11", "en": "Prussian blue", "he": "", "mean": "צובעת מצבורי ברזל בכחול.", "cmp": ""}, {"id": "c9-12", "en": "Congo red", "he": "", "mean": "משמשת לצביעת עמילואיד בצבע כתמתם-אדום. מבצעים גם פולריזציה (אור מקוטב) והעמילואיד יזרח בירוק (Apple green birefringence).", "cmp": ""}, {"id": "c9-13", "en": "Toluidine blue", "he": "", "mean": "צביעה נפוצה לתאי מאסט, הגרנולות ייצבעו בצבע סגלגל.", "cmp": ""}, {"id": "c9-14", "en": "Von kossa", "he": "", "mean": "צביעה שמדגישה מצבורי סידן בצבע חום כהה- שחור.", "cmp": ""}, {"id": "c9-15", "en": "Immunohistochemistry", "he": "אימונוהיסטוכימיה", "mean": "שילוב של אימונולוגיה עם היסטולוגיה וכימיה. \nיש שימוש בנוגדנים לאנטיגן או מרכיב ספציפי בדוגמה וכך ניתן לזהות האם הם קיימים בה. \nנראה const KEY="patho-cards-v1";

const all=[];D.forEach(c=>c.terms.forEach(t=>{t.ch=c;all.push(t)}));
const rec=id=>S.r[id]||(S.r[id]={w:0,c:0,s:""});
const cnt=c=>{let k=0,l=0;c.terms.forEach(t=>{const r=S.r[t.id];if(r&&r.s==="k")k++;else if(r&&r.s==="l")l++});return{k,l,u:c.terms.length-k-l}};
let view="home",sess=null;

 const tabs=`<header><h1>כרטיסיות פתולוגיה כללית<small>למידה לפי שיעורים</small></h1><div class="tabs"><button class="${view==="home"?"on":""}" onclick="go('home')">שיעורים</button><button class="${view==="stats"?"on":""}" onclick="go('stats')">סטטיסטיקה</button></div></header>`;

}

 D.forEach(c=>{const k=cnt(c),n=c.terms.length;
  h+=`<div class="tile"><div class="n">שיעור ${c.id}</div><h2>${esc(c.title)}</h2>

  <div class="meta"><span>${n} מושגים</span><span>✓ ${k.k}</span><span>✗ ${k.l}</span><span>חדש ${k.u}</span></div>

function start(id,onlyL){

 if(!list.length){alert("אין כרטיסיות מתאימות");return}

 sess={c,list,i:0,flip:false,hist:[],k:0,l:0,rev:S.opt.rev,only:onlyL};

}

 if(!rev&&!back)return`<div class="tag">שיעור ${t.ch.id} · ${esc(t.ch.title)}</div><div class="term">${enHtml(t)}</div><div class="hint">הקש/י להיפוך</div>`;
 if(!rev&&back){
  return`<div class="tag">${t.en&&t.he?"תרגום ופירוש":"פירוש"}</div>`+(t.en&&t.he?`<div class="he">${esc(t.he)}</div>`:"")+(t.mean?`<div class="mean">${esc(t.mean)}</div>`:`<div class="empty">אין פירוש מפורט</div>`)+(t.cmp?`<div class="empty">${esc(t.cmp)}</div>`:"");
 }
 if(rev&&!back)return`<div class="tag">שיעור ${t.ch.id} · ${esc(t.ch.title)} · איזה מושג זה?</div><div class="mean" style="text-align:center">${esc(t.mean)}</div><div class="hint">הקש/י להיפוך</div>`;
 return`<div class="tag">המושג</div><div class="term">${enHtml(t)}</div>`+(t.en&&t.he?`<div class="he" style="text-align:center">${esc(t.he)}</div>`:"");
}
function renderStudy(el){
 const s=sess,t=s.list[s.i];
 el.innerHTML=`<div class="top"><button class="btn ghost" style="min-height:40px;padding:8px 14px" onclick="go('home')">← שיעורים</button><div class="prog"><i style="width:${s.i/s.list.length*100}%"></i></div><div class="cnt">${s.i+1} / ${s.list.length}</div></div>
 <div class="scene"><div class="card ${s.flip?"flip":""}" id="card" onclick="flip()"><div class="face">${face(t,s.rev,false)}</div><div class="face back">${face(t,s.rev,true)}</div></div></div>
 <div class="act"><button class="btn no" ${s.flip?"":"disabled"} onclick="rate(false)">✗ עוד לא יודע/ת</button><button class="btn yes" ${s.flip?"":"disabled"} onclick="rate(true)">✓ יודע/ת</button></div>
 <div class="sub"><button onclick="undo()" ${s.hist.length?"":"disabled"}>↶ חזרה לכרטיסייה הקודמת</button><button onclick="flip()">היפוך (רווח)</button></div>`;
}
function flip(){if(view!=="study")return;sess.flip=!sess.flip;$("card").classList.toggle("flip",sess.flip);document.querySelectorAll(".act .btn").forEach(b=>b.disabled=!sess.flip)}
function rate(k){
 if(!sess.flip)return;const t=sess.list[sess.i],r=rec(t.id);
 sess.hist.push({id:t.id,prev:{...r},k});
 if(k){r.c++;r.s="k";sess.k++}else{r.w++;r.s="l";sess.l++}
 save();sess.i++;sess.flip=false;
 if(sess.i>=sess.list.length){view="done"}
 render();
}
function undo(){
 const h=sess.hist.pop();if(!h)return;
 S.r[h.id]=h.prev;if(h.k)sess.k--;else sess.l--;
 sess.i--;sess.flip=false;if(view==="done")view="study";save();render();
}
function renderDone(el){
 const c=sess.c,k=cnt(c);
 el.innerHTML=`<div class="panel done"><div class="tag">שיעור ${c.id} · ${esc(c.title)}</div><div class="big">${sess.k} / ${sess.list.length}</div><p>ידעת ${sess.k} מושגים, ו־${sess.l} עוד לא.</p>
 <div class="bar" style="margin:14px 0"><i class="k" style="width:${sess.k/sess.list.length*100}%"></i><i class="l" style="width:${sess.l/sess.list.length*100}%"></i></div>
 <div class="row"><button class="btn" ${k.l?"":"disabled"} onclick="start(${c.id},true)">חזרה על מה שעוד לא ידעתי (${k.l})</button><button class="btn ghost" onclick="start(${c.id},false)">כל השיעור מחדש</button></div>
 <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="undo()">↶ תיקון הכרטיסייה האחרונה</button><button class="btn ghost" onclick="go('home')">לשיעורים</button></div></div>`;
}
document.addEventListener("keydown",e=>{
 if(view!=="study")return;
 if(e.code==="Space"||e.key==="Enter"){e.preventDefault();flip()}
 else if(e.key==="ArrowRight")rate(false);else if(e.key==="ArrowLeft")rate(true);
});

/* ---------- סטטיסטיקה ---------- */
const STOP=new Set(["of","the","and","with","in","to","a","an","for","on","by","or","של","עם","או","לא","על","בין","את","כל","ב","מן"]);
function toks(t){
 const out=new Map();
 (t.en||"").toLowerCase().replace(/[^a-z\s-]/g," ").split(/[\s-]+/).forEach(w=>{
  if(w.length<4||STOP.has(w))return;w=w.replace(/(s|es)$/,"");const st=w.length>7?w.slice(0,7):w;if(!out.has(st))out.set(st,w)});
 (t.he||"").replace(/[^\u05d0-\u05ea\s]/g," ").split(/\s+/).forEach(w=>{
  if(w.length<3||STOP.has(w))return;if(w[0]==="ה"&&w.length>3)w=w.slice(1);if(!out.has("h:"+w))out.set("h:"+w,w)});
 return out;
}
function stats(){
 const seen=all.filter(t=>S.r[t.id]&&(S.r[t.id].c+S.r[t.id].w)>0);
 if(!seen.length)return`<div class="panel"><h3>עדיין אין נתונים</h3><p class="empty">אחרי שתתרגל/י כמה כרטיסיות, כאן יופיעו המושגים הקשים ביותר, השיעורים המאתגרים והקשרים בין מה שקשה לזכור.</p></div>`;
 const rows=D.map(c=>{const ts=c.terms.filter(t=>S.r[t.id]);let w=0,c2=0;ts.forEach(t=>{w+=S.r[t.id].w;c2+=S.r[t.id].c});const k=cnt(c);return{c,rate:w+c2?w/(w+c2):null,n:w+c2,l:k.l}}).filter(x=>x.n);
 rows.sort((a,b)=>b.rate-a.rate);
 let h=`<div class="panel"><h3>באילו שיעורים הכי קשה</h3><p class="empty" style="margin-top:-6px">אחוז הפעמים שסימנת "עוד לא יודע/ת" מתוך כל הדירוגים בשיעור</p>`;
 rows.forEach(x=>h+=`<div class="brow"><span>${x.c.id}. ${esc(x.c.title)}</span><div class="bar"><i class="l" style="width:${x.rate*100}%"></i></div><span>${Math.round(x.rate*100)}%</span></div>`);
 h+="</div>";
 const hard=seen.filter(t=>S.r[t.id].w>0).map(t=>{const r=S.r[t.id];return{t,r,sc:r.w/(r.w+r.c)+r.w*0.01}}).sort((a,b)=>b.sc-a.sc).slice(0,12);
 h+=`<div class="panel"><h3>המושגים שהכי קשה לך איתם</h3>`;
 if(!hard.length)h+=`<p class="empty">עוד לא סימנת מושגים כקשים. כל הכבוד!</p>`;
 hard.forEach(x=>h+=`<div class="li"><b>${enHtml(x.t)}</b><span class="empty">· שיעור ${x.t.ch.id}</span><span class="pill">${x.r.w} טעויות מתוך ${x.r.w+x.r.c}</span></div>`);
 h+="</div>";
 // קשרים: מילים משותפות בין מושגים שעוד לא ידועים
 const idx=new Map();
 all.forEach(t=>toks(t).forEach((w,st)=>{let e=idx.get(st);if(!e)idx.set(st,e={w,t:[]});e.t.push(t)}));
 const links=[];
 idx.forEach((e,st)=>{
  if(e.t.length<2)return;
  const u=e.t.filter(t=>S.r[t.id]&&S.r[t.id].s==="l");
  if(u.length>=2&&u.length/e.t.length>=0.5)links.push({w:e.w,u,n:e.t.length});
 });
 links.sort((a,b)=>b.u.length-a.u.length||b.u.length/b.n-a.u.length/a.n);
 h+=`<div class="panel"><h3>גורם מקשר בין מושגים שעוד לא זכרת</h3>`;
 if(!links.length)h+=`<p class="empty">כשיהיו כמה מושגים לא ידועים עם מילה משותפת (למשל אותו איבר או אותו תהליך), הקשר יופיע כאן.</p>`;
 const used=new Set();
 links.slice(0,8).forEach(l=>{
  const fresh=l.u.filter(t=>!used.has(t.id));if(fresh.length<2&&used.size)return;l.u.forEach(t=>used.add(t.id));
  h+=`<div style="margin:6px 0 14px"><b>"${esc(l.w)}"</b> <span class="empty">· ${l.u.length} מתוך ${l.n} מושגים עם המילה הזו עוד לא ידועים</span><div class="empty" style="margin-top:4px">${l.u.map(t=>enHtml(t)).join(" · ")}</div></div>`});
 // ציסטות/השוואות מפורשות
 const byCh=D.map(c=>({c,l:c.terms.filter(t=>S.r[t.id]&&S.r[t.id].s==="l")})).filter(x=>x.l.length>=3).sort((a,b)=>b.l.length-a.l.length)[0];
 if(byCh)h+=`<p class="empty">שיעור ${byCh.c.id} (${esc(byCh.c.title)}) הוא זה שבו נשארו הכי הרבה מושגים לא ידועים: ${byCh.l.length}.</p>`;
 h+="</div>";
 h+=`<div class="row"><button class="btn ghost" onclick="if(confirm('לאפס את כל ההתקדמות והסטטיסטיקה?')){S.r={};save();render()}">איפוס כל ההתקדמות</button></div>`;
 return h;
}
render();
</script>
</body></html>
