<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כרטיסיות פתולוגיה כללית</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee6;--bg2:#ebe3d8;--card:#fffcf7;--ink:#2d2b33;--mute:#7a7580;--line:#e2d9cc;--acc:#5f8a83;--acc-i:#fff;--know:#5c9a77;--learn:#d4964f;--unseen:#ddd4c7;--shadow:0 10px 30px rgba(80,60,40,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c22;--bg2:#2a2830;--card:#292730;--ink:#efeae2;--mute:#a39da9;--line:#3a3742;--acc:#7fb3aa;--acc-i:#13211f;--know:#78b894;--learn:#e0a965;--unseen:#3b3844;--shadow:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(1200px 500px at 85% -10%,var(--bg2),transparent),var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0;font-weight:700}
h1 small{display:block;font-weight:300;font-size:14px;color:var(--mute)}
.tabs{display:flex;background:var(--bg2);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;color:var(--mute);font:500 16px Heebo;padding:9px 18px;border-radius:11px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:400 15px Heebo;padding:9px 15px;border-radius:99px;cursor:pointer}
.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--card))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tile .n{font-size:13px;color:var(--mute)}
.tile h2{margin:0;font-size:19px;font-weight:700}
.bar{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--unseen)}
.bar i{display:block;height:100%}.bar .k{background:var(--know)}.bar .l{background:var(--learn)}
.meta{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.btn{border:0;font:500 16px Heebo;border-radius:14px;padding:13px 16px;cursor:pointer;background:var(--acc);color:var(--acc-i);min-height:48px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.prog{flex:1;height:6px;background:var(--unseen);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cnt{font-size:14px;color:var(--mute);min-width:56px;text-align:center}
.scene{perspective:1400px}
.card{display:grid;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);min-height:340px}
.card.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px 24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;gap:14px}
.face.back{transform:rotateY(180deg);justify-content:flex-start}
.tag{font-size:13px;color:var(--mute);letter-spacing:.02em}
.term{font:700 clamp(28px,6vw,44px)/1.2 Fraunces,Heebo,serif;text-align:center;overflow-wrap:anywhere}
.hint{text-align:center;font-size:13px;color:var(--mute)}
.he{font-size:clamp(22px,4.5vw,30px);font-weight:700;color:var(--acc)}
.en2{font:500 15px Fraunces,serif;color:var(--mute)}
.mean{font-size:clamp(17px,3.2vw,20px);white-space:pre-line}
.act{display:flex;gap:10px;margin-top:16px}.act .btn{flex:1;min-height:56px;font-size:17px}
.no{background:var(--learn);color:#2a1d0c}.yes{background:var(--know);color:#0f2418}
.sub{display:flex;justify-content:space-between;margin-top:10px}
.sub button{background:none;border:0;color:var(--mute);font:400 14px Heebo;padding:8px;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:18px}
.done{text-align:center}.done .big{font:700 52px Fraunces;margin:6px 0}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.li:first-of-type{border-top:0}.li b{font-weight:500}.li .en{direction:ltr;unicode-bidi:isolate}
.pill{margin-inline-start:auto;font-size:12px;background:color-mix(in srgb,var(--learn) 25%,var(--card));padding:2px 10px;border-radius:99px;white-space:nowrap}
.brow{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.empty{color:var(--mute);font-size:15px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media (max-width:520px){.brow{grid-template-columns:96px 1fr 40px}.face{padding:22px 18px}}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const D=[{"id": 1, "title": "הקדמה", "terms": [{"id": "c1-0", "en": "Pathology", "he": "פתולוגיה", "mean": "תורת המחלות", "cmp": ""}, {"id": "c1-1", "en": "Anatomical pathology", "he": "פתולוגיה אנטומית", "mean": "אבחון מחלות על בסיס המראה המאקרוסקופי והמיקרוסקופי, (לצד בדיקות מולקולריות נוספות) של רקמות וגופים שלמים. עוסקת בעיקר במורפולוגיה של רקמות", "cmp": ""}, {"id": "c1-2", "en": "Clinical pathology", "he": "פתולוגיה קלינית", "mean": "אבחון מחלות על סמך ניתוח מעבדה ואנליזה של נוזלי גוף שונים, באמצעות כימיה, מיקרוביולוגיה, המטולוגיה ופתולוגיה מולקולרית.", "cmp": ""}, {"id": "c1-3", "en": "Disease", "he": "מחלה", "mean": "מצב חריג מסוים המשפיע לרעה על המבנה ו\\או התפקוד של האורגניזם כולו או חלק ממנו.", "cmp": ""}, {"id": "c1-4", "en": "Clinical disease", "he": "מחלה קלינית", "mean": "מצב תחלואתי בו מופיעים סימנים קלינים (או תסמינים\\סמפטומים בבני אדם) הנראים לעין.", "cmp": ""}, {"id": "c1-5", "en": "Subclinical disease", "he": "מחלה תת-קלינית", "mean": "מצב תחלואתי בו קיימים שינויים פתולוגיים בגוף אך ללא סימנים קלינים (או תסמינים).", "cmp": ""}, {"id": "c1-6", "en": "Congenial disease", "he": "מחלה מולדת", "mean": "מחלה אותה נושא האורגניזם בגופו מרגע היוולדו, כתוצאה מגורמים גנטיים או סביבתיים (למשל זיהומים במהלך ההיריון).", "cmp": ""}, {"id": "c1-7", "en": "Acquired disease", "he": "מחלה נרכשת", "mean": "מחלה המתפתחת בגוף האורגניזם במהלך החיים (לאחר ההמלטה), כתוצאה מגורמים שונים.", "cmp": ""}, {"id": "c1-8", "en": "External Factors's disease", "he": "מחלה מגורם חיצוני", "mean": "מחלה הנגרמת כתוצאה מחשיפה לסביבה, כמו רעלנים, פתוגנים (חיידקים וירוסים וכדומה), טראומה, קרינה ועוד.", "cmp": ""}, {"id": "c1-9", "en": "Internal Factors's disease", "he": "מחלה מגורם פנימי", "mean": "מחלה הנגרמת כתוצאה מתהליכים פנימיים בגוף, כמו גנטיקה, חוסר איזון הורמונלי ותהליכים אוטואימוניים שונים.", "cmp": ""}, {"id": "c1-10", "en": "Primary disease", "he": "מחלה ראשונית", "mean": "מחלה שנגרמת באופן ישיר, ללא סיבה אחרת שקדמה לה. נחשבת לגורם הראשי לבעיה הרפואית שהתפתחה.", "cmp": ""}, {"id": "c1-11", "en": "Secondary disease", "he": "מחלה שניונית", "mean": "מחלה שמתפתחת כתוצאה או סיבוך של מחלה ראשונית קיימת.", "cmp": ""}, {"id": "c1-12", "en": "Acute disease", "he": "מחלה אקוטית", "mean": "מחלה בעלת משך זמן קצר יחסית (סדר גודל של ימים).", "cmp": ""}, {"id": "c1-13", "en": "Chronic disease", "he": "מחלה כרונית", "mean": "מחלה בעלת משך זמן ארוך יחסית (שבועות-שנים).", "cmp": ""}, {"id": "c1-14", "en": "Etiology", "he": "אטיולוגיה", "mean": "כשמדברים על גורמים של מחלות, קוראים לגורם המחלה או לקטגוריה של הגורמים \"אטיולוגיה\". האטיולוגיה חשובה על מנת להבין את המחלה ומדוע היא נגרמת.", "cmp": ""}, {"id": "c1-15", "en": "Degenerative disease", "he": "מחלה דגנרטיבית", "mean": "מחלה ניוונית", "cmp": ""}, {"id": "c1-16", "en": "Developmental", "he": "מחלה התפתחותית", "mean": "בעיות בתהליך ההתפתחות של איברים או רקמות. רובן מולדות (מתרחשות בתקופה העוברית) אך לא כולן.", "cmp": ""}, {"id": "c1-17", "en": "Autoimmune", "he": "מחלה אוטואימונית ואלרגיות", "mean": "כאשר מע' החיסון מגיבה כנגד הגוף עצמו.", "cmp": ""}, {"id": "c1-18", "en": "Allergic", "he": "אלרגיות", "mean": "כאשר מע' החיסון מגיבה כנגד מרכיב שהיא אינה אמורה להגיב כנגדו (למשל קרדית האבק).", "cmp": ""}, {"id": "c1-19", "en": "Mechanical", "he": "גורמים מכניים", "mean": "הפרעות לשלד וכדומה.", "cmp": ""}, {"id": "c1-20", "en": "Metabolic", "he": "מחלות מטבוליות", "mean": "מחלות הורמונליות וכדומה.", "cmp": ""}, {"id": "c1-21", "en": "Nutritional", "he": "מחלות תזונתיות", "mean": "", "cmp": ""}, {"id": "c1-22", "en": "Neoplastic", "he": "מחלות נאופלסטיות", "mean": "", "cmp": ""}, {"id": "c1-23", "en": "Inflammatory", "he": "מחלות דלקתיות", "mean": "דלקת זיהומית או שאינה זיהומית (סטרילית)", "cmp": ""}, {"id": "c1-24", "en": "Ischemic", "he": "איסכמיה", "mean": "חוסר באספקת דם שמביא בהכרח להיפוקסיה.", "cmp": ""}, {"id": "c1-25", "en": "Inherited", "he": "מחלות תורשתיות", "mean": "", "cmp": ""}, {"id": "c1-26", "en": "Iatrogenic", "he": "מחלות יאטרוגניות", "mean": "סיבוכים הנובעים מפרוצדורה רפואית (אבחונית, מניעתית או טיפולית) בין אם מבוצעת ע\"י הוטרינר, אסיסטנט וכו'.", "cmp": ""}, {"id": "c1-27", "en": "Idopathic", "he": "מחלות אדיופטיות", "mean": "מחלות שהגורם שלהן לא ידוע.", "cmp": ""}, {"id": "c1-28", "en": "Toxic", "he": "הרעלות", "mean": "", "cmp": ""}, {"id": "c1-29", "en": "Traumatic", "he": "טראומות (חבלה בלבד, לא טראומה רגשית)", "mean": "", "cmp": ""}, {"id": "c1-30", "en": "Inherited", "he": "מחלה תורשתית", "mean": "מחלה שמועברת מהורה לצאצא דרך מנגנון הורשה גנטי ידוע.", "cmp": ""}, {"id": "c1-31", "en": "Familial", "he": "מחלה משפחתית", "mean": "מחלות שמופיעות בשכיחות גבוהה יותר במשפחות מסוימות, כאשר הגן ומנגנון ההורשה אינם ידועים. הן אינן מסווגות כתורשתיות.", "cmp": ""}, {"id": "c1-32", "en": "Anamnesis", "he": "אנמנזה", "mean": "ההיסטוריה הרפואית הקלינית של המטופל. את האנמנזה לוקחים מהבעלים של החיה, זהו מידע משמעותי באבחנה.", "cmp": ""}, {"id": "c1-33", "en": "Pathogenesis", "he": "פתוגנזה", "mean": "שלבי התפתחות המחלה. למשל במחלות זיהומיות, מדובר על כל השלבים מחדירת הפתוגן לגוף בע\"ח ועד להופעת הלקויות האופייניות למחלה, מותו של בעל החיים או החלמתו.", "cmp": ""}, {"id": "c1-34", "en": "Prognosis", "he": "פרוגנוזה", "mean": "תוצאה קלינית פוטנציאלית, מהי הסבירות לתוצאה מסוימת כמו למשל החלמה, צליעה, מוות וכדומה.", "cmp": ""}, {"id": "c1-35", "en": "Diagnosis", "he": "דיאגנוזה (Dx)", "mean": "אבחנה", "cmp": ""}, {"id": "c1-36", "en": "Clinical signs", "he": "סימנים קליניים", "mean": "סימנים ושינויים פתולוגים בגוף בע\"ח הנראים לעין. ניתן להעריך מההסטוריה והבדיקה הפיזיקלית מה לא תקין בבע\"ח.", "cmp": ""}, {"id": "c1-37", "en": "Definitive Diagnosis", "he": "אבחנה ודאית (סופית)", "mean": "האבחנה הסופית ברמת בטחון גבוהה. אידיאלי מבחינת טיפול או קבלת החלטות.", "cmp": ""}, {"id": "c1-38", "en": "Tentative Diagnosis", "he": "אבחנות טנטיבית \\ משוערת", "mean": "אבחנה לא ודאית (החשד העיקרי). נקבעת על סמך ממצאים חלקיים או לא חד-משמעיים, ומשמשת כנקודת מוצא להמשך בירור, טיפול או מעקב.", "cmp": ""}, {"id": "c1-39", "en": "Differential diagnosis", "he": "אבחנה מבדלת", "mean": "מסדרים ברשימה את המחלות או המצבים הרפואיים השונים שעשויים להסביר את הסימנים הקליניים שהמטופל מראה. הרשימה נבנית מהאפשרות היותר סבירה לפחות סבירה. בתהליך האבחון מבצעים בדיקות נוספות (קליניות, מעבדתיות, דימות וכו') כדי לשלול בהדרגה חלק מהאבחנות ברשימה. המטרה היא לצמצם את הרשימה ככל האפשר, ובתקווה להשאר עם אבחנה אחת.", "cmp": ""}, {"id": "c1-40", "en": "Results", "he": "השלכות", "mean": "ישנן מחלות המשאירות חותם על בע\"ח כמו שינויים כרוניים למשל. חלק מהמחלות חוזרות בעתיד, חלקן יכולות לגרום למוות ומחלקן בע\"ח יחלים.", "cmp": ""}, {"id": "c1-41", "en": "Signalment", "he": "סינגלמנט", "mean": "מין בע\"ח (Specieis), גזע, גיל, זכר/נקבה ומצב רבייתי.", "cmp": ""}, {"id": "c1-42", "en": "Cheif complanit", "he": "תלונה ראשית", "mean": "הדאגה הגדולה ביותר של הבעלים, כלומר הסיבה שלשמה הם הגיעו למרפאה.", "cmp": ""}, {"id": "c1-43", "en": "Hematemesis", "he": "המטאמזיס", "mean": "הקאות דמיות", "cmp": ""}, {"id": "c1-44", "en": "Hematochezia", "he": "המטוכזיה", "mean": "דם טרי בצואה (בצבע אדום), סביר יותר שמקורו ממע' העיכול התחתונה.", "cmp": ""}, {"id": "c1-45", "en": "Melena", "he": "מלנה", "mean": "דם מעוכל בצואה (בצבע כהה), ככל הנראה מגיע ממע' העיכול העליונה (או לעיתים ממקומות אחרים לרבות מערכת הנשימה)", "cmp": ""}, {"id": "c1-46", "en": "Pathognomonic finding", "he": "ממצא פתוגנומוני", "mean": "ממצא שאופייני וספציפי מאוד למחלה מסוימת (לא בהכרח רגיש). ברגע שממצא זה קיים יודעים בוודאות על איזו מחלה/גורם מדובר.", "cmp": ""}, {"id": "c1-47", "en": "Necropsy", "he": "נקרופסיה", "mean": "נתיחה שלאחר המוות.", "cmp": ""}, {"id": "c1-48", "en": "Unilateral", "he": "לקות יונילטראלית", "mean": "לקות שמופיעה בצד אחד בלבד של הגוף או של איבר זוגי.", "cmp": ""}, {"id": "c1-49", "en": "Bilateral", "he": "לקות בילטראלית", "mean": "לקות שמופיעה בשני צידי הגוף או בשני איברים זוגיים (או לעיתים בשני הצדדים של איבר יחיד, כמו הלב)", "cmp": ""}, {"id": "c1-50", "en": "Symmetric", "he": "לקות סימטרית", "mean": "לקות שמופיעה באותו האופן בשני הצדדים של הגוף/איבר.", "cmp": ""}, {"id": "c1-51", "en": "Asymmetric", "he": "לקות א-סימטרית", "mean": "לקות שמופיעה באופן שונה בשני צדדי הגוף או שמופיעה רק בצד אחד של הגוף.", "cmp": ""}, {"id": "c1-52", "en": "Focal", "he": "לקות פוקאלית", "mean": "לקות מוקדית", "cmp": ""}, {"id": "c1-53", "en": "Multifocal", "he": "לקות מולטי-פוקאלית", "mean": "רב-מוקדית", "cmp": ""}, {"id": "c1-54", "en": "Multifocal to Coalescing", "he": "מולטי-פוקאלי עד מתזמג", "mean": "כאשר חלק מהמוקדים מתזמגים האחד עם השני.", "cmp": ""}, {"id": "c1-55", "en": "Locally extensive", "he": "לקות מקומית נרחבת", "mean": "מוקד אחד שהוא יחסית רחב אך לא מערב את כל האיבר (לא דיפוזי)", "cmp": ""}, {"id": "c1-56", "en": "Diffuse", "he": "לקות דיפוזית", "mean": "כאשר כל האיבר או כמעט כולו מעורב.", "cmp": ""}, {"id": "c1-57", "en": "Segmental", "he": "סגמנטלי", "mean": "הגדרה המשמשת לאיברים צינוריים.", "cmp": ""}, {"id": "c1-58", "en": "Acute", "he": "מחלה או לקות אקוטית", "mean": "מהירה יותר, טווח זמן של ימים בודדים.", "cmp": ""}, {"id": "c1-59", "en": "Chronic", "he": "מחלה או לקות כרונית", "mean": "לקות ממושכת, טווח זמן של שבועות עד שנים ולפעמים אפילו עד סוף חייו של בע\"ח.", "cmp": ""}, {"id": "c1-60", "en": "Peracute", "he": "מחלה פר-אקוטית", "mean": "המהירה ביותר. טווח זמן של דקות עד שעות. כל כך מהיר שפעמים רבות לא רואים שינויים מורפולוגיים בנתיחה, כאשר בע\"ח מת תוך דקות בודדות", "cmp": ""}, {"id": "c1-61", "en": "Subacute", "he": "לקות סאב-אקוטית", "mean": "בין אקוטי לכרוני. טווח זמן של בערך שבוע - 10 ימים", "cmp": ""}, {"id": "c1-62", "en": "Acute on chronic", "he": "החמרה אקוטית של מצב כרוני", "mean": "מחלה כרונית, איטית ומתמשכת, מקבלת מרכיב אקוטי – שמחמיר את התמונה הקלינית או הפתולוגית.", "cmp": ""}, {"id": "c1-63", "en": "Normal findings", "he": "ממצאים נורמליים", "mean": "שינויים בגוף שמופיעים בעקבות תהליכים פיזיולוגיים שקורים במהלך החיים, הם לא בהכרח משמעותיים ולא בהכרח רלוונטים למוות בע\"ח.", "cmp": ""}, {"id": "c1-64", "en": "Pathological findings", "he": "ממצאים פתולוגיים", "mean": "ממצאים לא נורמליים המעידים על מצב תחלואתי, קרי הפרעה למבנה ו\\או התפקוד התקין של איברים ורקמות. יכולים להיות בעלי משמעות קלינית גבוהה או נמוכה (ראה ממצא אקראי).", "cmp": ""}, {"id": "c1-65", "en": "Incidental findings", "he": "ממצאים אקראיים", "mean": "ממצאים פתולוגיים שיש להם רלוונטיות קלינית נמוכה ובדר\"כ נפגוש אותם במקרה. ממצא שבדר\"כ לא קשור לסיבה שבגללה הגופה נשלחה לנתיחה שלאחר המוות.", "cmp": ""}, {"id": "c1-66", "en": "Agonal changes", "he": "שינויים אגונאלים", "mean": "שינויים בגוף שקורים בגלל הגסיסה עצמה ולא בגלל המחלה הראשונית. אלו שינויים שלא קורים לאחר המוות, אלא הם קורים ברגעיו האחרונים של בע\"ח לרוב כתוצאה מקריסת המערכות המתרחשת לקראת המוות, למשל המערכת קרדיווסקולרית.", "cmp": ""}, {"id": "c1-67", "en": "post-mortem", "he": "שינויים לאחר המוות", "mean": "שינויים שקורים לאחר המוות. אלו השינויים הבעייתים ביותר, הם עשויים למסך או לבלבל עם שינויים פתולוגיים אמיתיים (Antemortem). ישנם שינויים שקורים לאחר המוות ונחשבים לתוצאה צפויה של תהליכים פיזיולוגיים אחרי המוות, הם לא מעידים על מחלה או על הסיבה למוות.", "cmp": ""}, {"id": "c1-68", "en": "Morphologic diagnosis", "he": "אבחנה מורפולוגית", "mean": "אבחנה המתארת את מה שרואים בעין, זוהי אבחנה של לקויות. מתארים את האיבר בו רואים את הלקות, מתארים את סוג, אופי, פיזור, משך וחומרת הלקות בלבד. באבחנה זו נתאר את הגורם ללקות רק אם זיהינו אותו בתוך הלקות.", "cmp": ""}, {"id": "c1-69", "en": "Etiologic diagnosis", "he": "אבחנה אטיולוגית", "mean": "אבחנה סופית של מה האיבר ומה הגורם. זו אבחנה שמורכבת מהאיבר + הגורם.", "cmp": ""}, {"id": "c1-70", "en": "Cause", "he": "הגורם", "mean": "תיאור הגורם ללקות. אם בודד חיידק מסוים מהמעי למשל זה לא אומר בהכרח שהוא גורם המחלה.", "cmp": ""}, {"id": "c1-71", "en": "Name of disease", "he": "שם המחלה", "mean": "אבחנה סופית עם שם המחלה שגרמה ללקות. ישנן מחלות עם שם עממי שהוא מוכר יותר, זוהי לא אבחנה מורפולוגית אלא זה פשוט השם המוכר של המחלה.", "cmp": ""}, {"id": "c1-72", "en": "\"End-stage\" organ", "he": "איבר סופני", "mean": "איבר שכבר לא יודעים לזהות מה היה גורם הפגיעה מרוב שהוא הרוס. במקרים רבים, בחתך היסטולוגי קשה עד לא ניתן לזהות את האיבר כבר. לא ניתן לקבוע אבחנה לגורם הראשוני לאיבר כזה. גם מבחינה תפקודית זה איבר שלא מתפקד.", "cmp": ""}, {"id": "c1-73", "en": "Histology", "he": "היסטולוגיה", "mean": "\"היסטו\" = רקמות. מזהים ומבדילים בין רקמות, תאים ואיברים שונים תחת המיקרוסקופ, ניתן ללמוד גם על התאים, המבנים שהם יוצרים וגם על המטריקס הבין תאי (ECM).", "cmp": ""}, {"id": "c1-74", "en": "Histopathology", "he": "היסטופתולוגיה", "mean": "כשהרקמה/תא/איבר לא תקין. הרעיון הוא זיהוי שינויים מיקרוסקופים ברקמות ולהסיק מהם על הפונקציה שהלכה לאיבוד.", "cmp": ""}, {"id": "c1-75", "en": "Incisional", "he": "דגימה חלקית", "mean": "לקיחת חתיכה קטנה ממהמסה אותה דוגמים.", "cmp": ""}, {"id": "c1-76", "en": "Excisional", "he": "דגימה מלאה", "mean": "הסרת הגידול כולו, לפעמים אפילו עם שוליים של רקמה תקינה ע\"מ לוודא שלא נשארו תאים נאופלסטיים בגוף.", "cmp": ""}, {"id": "c1-77", "en": "Full thickness biopsy", "he": "ביופסיה בעובי מלא", "mean": "לקיחת דגימה של כל עובי האיבר.", "cmp": ""}, {"id": "c1-78", "en": "Partial thickness", "he": "ביופסיה בעובי חלקי", "mean": "לקיחת דגימה של חלק מהשכבות בלבד (למשל רק רירית המעי)", "cmp": ""}, {"id": "c1-79", "en": "Representative specimen", "he": "דגימה מייצגת", "mean": "דגימת רקמה המשקפת\\מייצגת בצורה הטובה ביותר את התהליך הפתולוגי החשוד באזור הנבדק.", "cmp": ""}, {"id": "c1-80", "en": "Fixation", "he": "קיבוע", "mean": "בדר\"כ תאים/חלבונים מתפרקים לאחר המוות ולכן נרצה לעצור את פירוקם. בדר\"כ משתמשים בפורמלין כאשר יחס נפחי הפורמלין לרקמה הוא 10:1 (10 פורמלין, 1 רקמה). זמן פיקסציה מינימלי הכרחי הוא בין 24-48 שעות.", "cmp": ""}, {"id": "c1-81", "en": "Trimming", "he": "חיתוך", "mean": "לאחר הקיבוע נרצה לחתוך את הרקמה כדי שתוכל להיכנס לקסטה. החיתוך הוא בעובי 2-3 מ\"מ.", "cmp": ""}, {"id": "c1-82", "en": "Embedding", "he": "הטבעה", "mean": "לוקחים את הרקמה עם הפורמלין ומחליפים את הפורמלין בפרפין ומכניסים את הרקמה לקסטה. המטרה היא לקבל בלוק של שעוות פרפין עם הרקמה בתוכו. מהבלוק עצמו חותכים פרוסות דקות מאוד לסליידים.", "cmp": ""}, {"id": "c1-83", "en": "Sectioning", "he": "חיתוך במיקרוטום", "mean": "חיתוך הפרוסות מהבלוק פרפין. ככל שהפרוסה דקה יותר כך נוכל לזהות בצורה ברורה יותר כל שכבה ושכבה וכל תא ותא.", "cmp": ""}, {"id": "c1-84", "en": "Staining", "he": "צביעה", "mean": "צביעת הרקמה. ישנן צביעות שונות המדגישות דברים שונים.", "cmp": ""}, {"id": "c1-85", "en": "Light microscopy", "he": "מיקרוסקופ אור", "mean": "מגדיל את הרקמות עד פי 1500. יש מגבלה לכמות ההגדלה כי לא ניתן לראות מתחת לאורך הגל של האור, ניתן להגדיל עד 0.2 מיקרון.", "cmp": ""}, {"id": "c1-86", "en": "Artifact", "he": "ארטיפקט", "mean": "שינויים מבניים ברקמה שנוצרים כתוצאה מתהליך ההכנה הטכני של הדגימה. הם לא מייצגים לקויות אמיתיות שהיו קיימות בגוף לפני המוות, ולכן אין לפרשם כתהליך פתולוגי אמיתי. הם מקשים על זיהוי לקויות אמיתיות.", "cmp": ""}, {"id": "c1-87", "en": "Immunohistochemistry", "he": "אימונוהיסטוכימיה", "mean": "שיטת אבחון שמשתמשת בנוגדנים המסומנים בצבע לזיהוי אנטיגנים ספציפיים ברקמות, תוך שמירה על המיקום האנטומי המדויק של האנטיגן. טכניקה זו ממקמת את האנטיגן שמחפשים במקום בו רוצים לזהות אותו. אימונוהיסטוכימיה (בד\"כ) לא מבדילה בין תא נאופלסטי לבין תא נורמלי וזה היתרון של טכניקה זו.", "cmp": ""}, {"id": "c1-88", "en": "Cytology", "he": "ציטולוגיה", "mean": "טכניקה המאפשרת לראות תאים שלמים, ללא הארכיטקטורה של הרקמה. ציטולוגיה דוגמת בעיקר תאים ואת המטריקס סביבם. היתרון בלראות תאים שלמים זה שהמורפולוגיה הרבה יותר ברורה, ניתן לראות פרטים עדינים בציטופלסמה ובגרעין שקשה או לעיתים בלתי אפשרי לראות בהיסטולוגיה.", "cmp": ""}]}, {"id": 2, "title": "נזק תאי", "terms": [{"id": "c2-0", "en": "Cytosol", "he": "ציטוזול", "mean": "נוזל התא", "cmp": ""}, {"id": "c2-1", "en": "Cytoplasm", "he": "ציטופלזמה", "mean": "כל מה שרואים בתוך התא במיקרוסקופ - בין הממברנה החיצונית לגרעין התא (כולל האברונים, אך לא כולל הממברנה והגרעין).", "cmp": ""}, {"id": "c2-2", "en": "Cell membrane", "he": "ממברנת התא", "mean": "שתי שכבות של פוספוליפידים וחלבונים שונים, העוטפים את התא ואת האברונים שבתוכו. הממברנה מהווה מחסום בין הסביבה החיצונית של התא לסביבה הפנימית, ומונעת מגורמים חיצוניים להיכנס ומאלקטרוליטים לנוע באופן חופשי ולגרום לנזק.", "cmp": ""}, {"id": "c2-3", "en": "Phagocytosis", "he": "פאגוציטוזה", "mean": "התא מייצר ״שלוחות ציטופלזמיות״ ע״י ארגון השלד התוך תאי (אקטין) ובולע חלקיק גדול וזר שנמצא מחוץ לתא.", "cmp": ""}, {"id": "c2-4", "en": "Transcytosis", "he": "טרנסציטוזה", "mean": "חומרים שנכנסים מצד אחד של התא ויוצאים מהצד השני.", "cmp": ""}, {"id": "c2-5", "en": "Pagosome", "he": "פאגוזום", "mean": "אברון תאי זמני שנוצר בתוך תא בעקבות תהליך של פאגוציטוזה - בליעה של חלקיקים גדולים כמו חיידקים, שאריות תאים מתים או גופים זרים.", "cmp": ""}, {"id": "c2-6", "en": "Lysosome", "he": "ליזוזום", "mean": "אברון תאי שמכיל אנזימים פרוטאוליטיים שאינם משופעלים, אלא לאחר מפגש עם פאגוזום (מקרה פרטי – אוטוליזה).", "cmp": ""}, {"id": "c2-7", "en": "Phagolysosome", "he": "פאגוליזוזום", "mean": "איחוי של הפאגוזום והליזוזום, האנזימים הפרוטאוליטיים של הליזוזום מפרקים את החיידק.", "cmp": ""}, {"id": "c2-8", "en": "Ligand", "he": "ליגנד", "mean": "כל חומר שיתחבר לרצפטור תאי וייצור קסקדה של סיגנלים שיוצרים שינויים מבניים או תפקודיים בתא.", "cmp": ""}, {"id": "c2-9", "en": "Cytoskeleton", "he": "שלד תוך תאי", "mean": "שלד תוך תאי שמטרתו היא לשמור על מבנה התא (Intermediate filament), להניע אברונים ווסיקולות (Microtubules), יצירת תנועה של התא עצמו (כמו אמבה) ועיגון לדברים חיצוניים, כמו תאים שכנים (Actin microfilament).", "cmp": ""}, {"id": "c2-10", "en": "Cell nucleus", "he": "גרעין התא", "mean": "מכיל את הDNA שממנו משועתקים mRNA שמקודדים לחלבונים שונים.", "cmp": ""}, {"id": "c2-11", "en": "Heterochromatin", "he": "הטרוכרומטין", "mean": "איזור \"סגור\" יחסית בDNA ולכן משועתק במידה נמוכה יותר.", "cmp": ""}, {"id": "c2-12", "en": "Euchromatin", "he": "אאוכרומטין", "mean": "איזור \"פתוח\" יחסית בDNA שמשועתק בקלות רבה יותר.", "cmp": ""}, {"id": "c2-13", "en": "Nucleolus", "he": "גרעינון", "mean": "מבנה בתוך הגרעין עם הרבה ריבוזומים שאחראים לשיעתוק וייצור rRNA.", "cmp": ""}, {"id": "c2-14", "en": "Histones", "he": "היסטונים", "mean": "חלבונים שעוטפים את הDNA ואחראים על בקרת השיעתוק.", "cmp": ""}, {"id": "c2-15", "en": "Nucleosome", "he": "נוקליאוזום", "mean": "המבנה שמכיל את ההיסטונים והDNA.", "cmp": ""}, {"id": "c2-16", "en": "rER - Rough endoplasmic reticulum", "he": "-", "mean": "אחראי על סינתזה של חלבונים.", "cmp": ""}, {"id": "c2-17", "en": "sER - Smooth endoplasmic reticulum", "he": "-", "mean": "אחראי על סינתזה של ליפידים, סטרואידים, פחמימות, ועל מטבוליזם של חומרים אקסוגניים כמו סמים ורעלים.", "cmp": ""}, {"id": "c2-18", "en": "Golgi", "he": "גולג׳י", "mean": "אחראי על תרגום, עיבוד, מודיפיקציות, ואריזת חלבונים (=״דואר ישראל״).", "cmp": ""}, {"id": "c2-19", "en": "Ribosome", "he": "ריבוזום", "mean": "מייצר את החלבון ע״י תרגום של mRNA לשרשראות של חומצות אמינו. מורכב מחלבון ומrRNA, לכן צבע הרקמה יהיה באזופילי (כחלחל וסגלגל).", "cmp": ""}, {"id": "c2-20", "en": "Mitochondria", "he": "מיטוכונדריה", "mean": "אחראית על ייצור אנרגיה בצורת ATP.", "cmp": ""}, {"id": "c2-21", "en": "ECM", "he": "מטריקס בין תאי", "mean": "הסביבה החוץ תאית המופרשת על ידי תאי הרקמה והרכבה משתנה בין רקמות, אבל לרוב מכילה חלבונים כמו קולגן, גליקואמינוגליקנים (GAGs), אנזימים שונים, אלקטרוליטים ומים.", "cmp": ""}, {"id": "c2-22", "en": "Homeostasis", "he": "הומיאוסטזיס", "mean": "מצב של שיווי משקל - שמירה על סביבה פנימית יציבה ללא יציאה מאיזון ביולוגי, פיזיקלי וכימי. שיווי המשקל נשמר ע״י מספר אמצעים רגולטוריים. יציאה מהומיאוסטזיס עלולה להוביל לנזק תאי, אך לא בהכרח (התא יכול להשתקם).", "cmp": ""}, {"id": "c2-23", "en": "ATP depletion", "he": "התדלדלות ATP", "mean": "ירידה במאגרי האנרגיה התוך תאיים. לא בכל התאים יש נשימה אנ-אירובית יעילה, וזה יכול להוביל לפגיעה תאית.", "cmp": ""}, {"id": "c2-24", "en": "Cellular adaptation", "he": "אדפטציה תאית", "mean": "תגובה הפיכה (לרוב) של תאים לשינויים בסביבתם\\ סטרס, אשרמטרתה לאפשר להם לשרוד ולתפקד בתנאים שאינם פיזיולוגיים רגילים.", "cmp": ""}, {"id": "c2-25", "en": "Cellular degeneration", "he": "דגנרציה", "mean": "שינויים מבניים ופונקציונליים הפיכים הנובעים מנזק תאי. במידה והזנק מחמיר או מתמשך והתא לא מסוגל לעבור אדפטציה, עלול להוביל למוות תאי.", "cmp": ""}, {"id": "c2-26", "en": "Acute cell swelling / Hydropic degeneration", "he": "-", "mean": "השינוי המורפולוגי התאי הנפוץ ביותר. התנפחות אקוטית של התא בעקבות כניסה של מים לתא, ולכן התא ייראה בהיר יותר (\"דליל\\מהול\"). מדובר בשינוי הפיך אבל אם הנזק ימשיך התא עלול להתפוצץ ולעבור לשלב בלתי הפיך (מוות תאי).", "cmp": ""}, {"id": "c2-27", "en": "Balloon degeneration", "he": "-", "mean": "מונח המתאר Acute cell swelling בעור.", "cmp": ""}, {"id": "c2-28", "en": "Cytotoxic edema", "he": "אדמה ציטוטוקסית", "mean": "מונח המתאר Acute cell swelling במערכת העצבים", "cmp": ""}, {"id": "c2-29", "en": "Free radicals", "he": "רדיקל חופשי", "mean": "מולקולה עם חוסר/עודף באלקטרון. ריאקטיבית מאוד, לא במצב יציב ורק רוצה לתת או לקחת אלקטרון למול׳ אחרת ולכן יכולה ליצור נזק (למשל לממברנת התא או ממברנת אברונים).", "cmp": ""}, {"id": "c2-30", "en": "ROS - Reactive oxygen species", "he": "-", "mean": "רדיקל חופשי שמכיל חמצן, יכול לגרום לנזק תאי.", "cmp": ""}, {"id": "c2-31", "en": "Hypoxia", "he": "היפוקסיה", "mean": "חוסר באספקת חמצן לתא או לרקמה.", "cmp": ""}, {"id": "c2-32", "en": "Ischemia", "he": "איסכמיה", "mean": "חוסר באספקת דם לתא או לרקמה. תופעה שמובילה להיפוקסיה, לצד חוסר בגלוקוז ונוטריינטים נוספים לתא, כמו גם היעדר פינוי פסולת מהתא.", "cmp": ""}, {"id": "c2-33", "en": "Blebs", "he": "בלבים", "mean": "בליטות ציטופלזמטיות מתוך התא כלפי חוץ, כתוצאה מנזק לתא והרס השלד התוך תאי.", "cmp": ""}, {"id": "c2-34", "en": "Ulcer", "he": "כיב", "mean": "חוסר רציפות (או \"חור\") של רקמה, לרוב רקמה אפיתליאלית (עור, ריריות או סרוזות). לניתן להשתמש גם לרקמת סחוס.", "cmp": ""}, {"id": "c2-35", "en": "Autophagy", "he": "אוטופאגיה", "mean": "עיכול תאי עצמי, כלומר פירוק עצמי של התא. לתא יש יכולת לפרק את עצמו כדי להימנע ממוות - הוא יכול להפיק חומרי גלם או נוטריינטים מהאברונים של עצמו, וכשהוא מקטין את כמות האברונים הוא צורך פחות אנרגיה ויכול לחיות יותר זמן.", "cmp": ""}, {"id": "c2-36", "en": "Necrosis", "he": "נמק", "mean": "צורת מוות תאי לא מבוקר (לכאורה), לרוב מערב קבוצות תאים ולא תאים בודדים. התא מתנפח עד שמתפוצץ ותוכנו נשפך לסביבה הבין תאית. תוצרי הנמק מהווים טריגר למע׳ החיסון וליצירה של דלקת.", "cmp": ""}, {"id": "c2-37", "en": "Oxidative stress", "he": "נזק אוקסידטיבי", "mean": "נזק תאי שנגרם בגלל רדיקלים חופשיים, אשר יכול להוביל למוות תאי.", "cmp": ""}, {"id": "c2-38", "en": "Reperfusion injury", "he": "פגיעה רפרפוזית", "mean": "כשיש איזור נמקי בגוף ואספקת הדם אליו הופסקה, ברגע שמחדשים את אספקת הדם לאיבר באופן פתאומי, כל הרעלנים והרדיקלים החופשיים שהצטברו ברקמה הנמקית שטים בזרם הדם אל הרקמות הבריאות, יכולים לפגוע במערכות חיוניות ואף להוביל למותו של בעל החיים", "cmp": ""}, {"id": "c2-39", "en": "Pyknosis", "he": "פיקנוזיס", "mean": "הגרעין נראה מכווץ\\דחוס, עגול והיפרכרומטי (כהה) בהיסטולוגיה.", "cmp": ""}, {"id": "c2-40", "en": "Karyorrhexis", "he": "קריורקסיס", "mean": "הגרעין נראה שבור בהיסטולוגיה, נראה שברי גרעינים (Nuclear fregments).", "cmp": ""}, {"id": "c2-41", "en": "Karyolysis", "he": "קריוליזיס", "mean": "הגרעין מתפרק ונראה תא בלי גרעין בהיסטולוגיה. נשים לב בהיסטולוגיה אם מדובר בכל קבוצת התאים או בתא ספציפי אחד.", "cmp": ""}, {"id": "c2-42", "en": "Coagulative necrosis", "he": "נמק קרישתי", "mean": "מאופיין בזה שאפשר לזהות את צורת התאים והמבנים, כלומר הם שומרים על הארכיטקטורה שלהם בחתך ההיסטולוגי. זאת מפני שהאנזימים הליזוזומלים מתפרקים מהר מאוד ולכן לא מספיקים לפרק את התא. מבחינת גרוס – האיברים בדר״כ יהיו חיוורים או ישנו את צבעם, הרקמה מוצקה ואינה מתפרקת, והיא שומרת על המבנה שלה. מבחינה היסטולוגית – הארכיטקטורה נשמרת, אבל יהיו שינויים מורפולוגיים מתאימים למשל בגרעין התא (פיקנוזיס/קריורקזיס/קריוליזיס). הציטופלזמה לרוב היפראאוזינופילית.", "cmp": ""}, {"id": "c2-43", "en": "Caseous necrosis", "he": "נמק גבינתי", "mean": "בגרוס – הרקמה לא שומרת על הארכיטקטורה שלה, היא נהיית דמויית גבינה ופריכה (מתפוררת בידיים). לרוב נראה את סוג נמק זה בגרנולומות או אבצסים. בהיסטולוגיה – נראה אובדן של המבנה, לרוב מוקף בדלקת גרנולומטוטית.", "cmp": ""}, {"id": "c2-44", "en": "Liquefactive necrosis", "he": "נמק מתמוסס/נוזלי", "mean": "הרקמה מתמוססת, מתפרקת והופכת לנוזלית. הארכיטקטורה לא נשמרת, וקיים הרס מוחלט של הרקמה. נפוץ במע׳ העצבים המרכזית בגלל שיש ברקמת העצבים ליפידים רבים שנהרסים מהר יותר (ככל שהרקמה מכילה יותר שומן – יש לה פרה דיספוזיציה להיהרס מהר יותר). שינויים בגרוס – שינוי צבע, לרוב צהוב, התרככות הרקמה ולפעמים נפיחות. בהיסטולוגיה – הרס רב כל כך שלא ניתן לזהות את הרקמה.", "cmp": ""}, {"id": "c2-45", "en": "Malacia", "he": "מלציה", "mean": "תיאור מורפולוגי בגרוס בלבד, לנמק במערכת העצבים. הרקמה העצבית \"מתרככת\".", "cmp": ""}, {"id": "c2-46", "en": "Gangrenous necrosis", "he": "נמק גנגרנוטי", "mean": "מאופיין במיקום שלו – קצוות של איברים, כמו גפיים, אוזניים, אף, זנב, עטינים, גם קצוות של איברים פנימיים כמו קצה של אונת ריאה. האיברים החיצוניים עלולים לעבור נמק גנגרנוטי בעקבות חוסר אספקת דם ואף לנשור (sluffing). בגרוס – נצפה לשינוי מרקם וצבע (אדום-סגול-שחור). בהיסטולוגיה – קשה לזהות את הרקמה, בדומה לנמק נוזלי.", "cmp": ""}, {"id": "c2-47", "en": "Dry gangrene", "he": "נמק גנגרנטי יבש", "mean": "אין זיהום משני ע״ג האיזור הנמקי.", "cmp": ""}, {"id": "c2-48", "en": "Wet gangrene", "he": "נמק גנגרנטי רטוב", "mean": "יש על הנמק זיהום חיידקי משני. אם מדובר בחיידקים שמייצרים גז, יכול להיות בועיות אוויר באיזור הנמק.", "cmp": ""}, {"id": "c2-49", "en": "Fat necrosis", "he": "נמק שומני", "mean": "נמק של רקמת השומן, בעל נטייה לעבור הסתיידות (מינרליזציה). יש הרס של תאי שומן שעוברים נמק, סידן שנמצא בדם שוקע ע״ג תאי השומן הנמקיים – תהליך שנקרא ספוניפיקציה. יכול להתרחש רק במהלך החיים מאחר ויש צורך בזרימת דם. סידן שנמצא בדם שוקע ע״ג האדיפוציטים הנמקיים. בגרוס – נראה רקמות שומן שעברו ספוניפיקציה. בהיסטולוגיה – תאי שומן נמקיים וחומר באזופילי (סגלגל) מגורגר מורפולגית מתאים להסתיידות, עם או ללא הסננה דלקתית נלווית.", "cmp": ""}, {"id": "c2-50", "en": "Saponification", "he": "ספוניפיקציה", "mean": "תהליך שבו שומנים בתאים מתפרקים ומתאחדים עם סידן ליצירת מלחי סבון (Soaps).", "cmp": ""}, {"id": "c2-51", "en": "Fibrinoid necrosis", "he": "נמק פיברינואידי", "mean": "נמק של דפנות כלי דם. מתאפיין במורפולוגיה דמויית פיברין (חלבון קרישה). נראה שחלבונים מהלומן של כלי הדם דולפים החוצה לתוך דופן כלי הדם שאמורה להיות אטומה. אם יש נזק לדופן כלי הדם, חלבונים מתוך הדם ידלפו החוצה וייצרו משקע פיברינואידי. מבחינה היסטולוגית – נראה הצטברות של משקעים אאוזונופיליים אמורפיים בדופן כלי הדם.", "cmp": ""}, {"id": "c2-52", "en": "Apoptosis", "he": "אפופטוזיס", "mean": "פירוש מילולי – \"נשירה\", \"שלכת\". מוות תאי מבוקר ומתוכנן, יכול להתרחש בהתפתחות עוברית, בתימוס, בעור, וזהו חלק נורמלי מהחיים כל עוד לא מדובר בפתולוגיה. לרוב מדובר במוות של תאים בודדים ולא בקבוצות תאים, בלי דלקת משנית ובלי נזק אגבי רב לרקמה. בניגוד לנמק, התהליך לא מתפרץ אל מחוץ לתא, אלא מתרחש בתוכו – יש התכווצות של האברונים והתא בתוך הממברנה, ואז התא \"נבלע\" (Phagocytized) ע״י תאים בולעניים. מבחינת הגרעין – פיקנוזיס או קריורקסיס (ללא קריוליזיס!), נראה blebbing או apoptotic bodies.", "cmp": ""}, {"id": "c2-53", "en": "Apoptotic bodies", "he": "גופים אפופטוטיים", "mean": "מבנים תאיים המוקפים ממברנה, הנוצרים כתוצאה מפירוק מסודר של תא שעובר אפופטוזיס ומכילים מכילים שברי ציטופלזמה, אברונים או שברי גרעין.", "cmp": ""}, {"id": "c2-54", "en": "Autolysis", "he": "אוטוליזה", "mean": "פירוק עצמי של הרקמות לאחר המוות. האנזימים בליזוזומים מתחילים לפעול בצורה לא מבוקרת ולפרק את הרקמות. נבדיל אוטוליזה מתהליך שקורה במהלך החיים ע״י תגובת הגוף להרס הרקמה – במידה וקיימת תגובה (דלקת) נדע שההרס התרחש במהלך החיים, פיזור השינויים (Distribution), אנמנזה וכו'.", "cmp": ""}, {"id": "c2-55", "en": "Putrefaction", "he": "ריקבון", "mean": "פירוק לאחר המוות שקורה כתוצאה מפירוק על ידי אוכלוסייה מיקרוביאלית, ולא מהאנזימים הליזוזמליים.", "cmp": ""}, {"id": "c2-56", "en": "Algor mortis", "he": "אלגור מורטיס", "mean": "צניחת טמפ׳ הגוף לאחר המוות לטמפטורת הסביבה.", "cmp": ""}, {"id": "c2-57", "en": "Pallor mortis", "he": "פאלור מורטיס", "mean": "חיוורון בקצות האצבעות לאחר המוות בעקבות היעדר זרימת דם.", "cmp": ""}, {"id": "c2-58", "en": "Postmortem bloat", "he": "נפיחות לאחר המוות", "mean": "כאשר האוכלוסייה המיקרוביאלית בקיבה ממשיכה לעבוד לאחר המוות, היא מייצרת גז וגורמת לנפיחות.", "cmp": ""}, {"id": "c2-59", "en": "Livor mortis / Hypostatic congestion", "he": "ליבור מורטיס", "mean": "כאשר בע״ח מת, הדם לאחר המוות ירד לכיוון הקרקע עם הגרביטציה (בתוך כלי הדם) ונקרש בצד התחתון של הגוף שצמוד לקרקע. במקום שהיו נקודות מגע/לחץ עם הקרקע הדם לא הגיע, ולכן האיזור הזה ייראה בהיר לעומת האיזור שבו הגיע הדם ונקרש בו.", "cmp": ""}, {"id": "c2-60", "en": "Hemoglobin imbibition", "he": "-", "mean": "24 שעות לאחר המוות האריטרוציטים מתפרקים, וההמוגלובין שמצוי בהם מתחיל לפעפע ולצבוע רקמות שכנות בצבע אדום.", "cmp": ""}, {"id": "c2-61", "en": "Pseudomelanosis", "he": "פסאודומלנוזיס", "mean": "החיידקים במעי מייצרים גזים לאחר המוות, כמו מימן גופרתי (Hydrogen sulfid). המימן הגופרתי מגיב עם הברזל בהמוגלובין שנמצא בכליה הצמודה למעי ויוצר חומר שנקרא ברזל-גופרתי (Iron-sulfid) שנותן גוון כחול-ירוק-שחור. אין פה מלנין! רק שינויי צבע (ולכן \"פסאודו\").", "cmp": ""}, {"id": "c2-62", "en": "Postmortem tympany", "he": "-", "mean": "קיבה נפוחה כתוצאה מתסיסה לאחר המוות.", "cmp": ""}, {"id": "c2-63", "en": "Postmortem blood clotting", "he": "קרישה לאחר המוות", "mean": "לאחר המוות קרישים נוצרים מהר מאוד, ושעות אחרי המוות אמורה להיות כבר כמות גדולה. מספר גורמים עוזרים לנו להבדיל בין קרישים שנוצרו לאחר המוות או לפני המוות - קרישים שנוצרים בחיים לרוב נוצרים מהר ולא יוכלו למלא את כל נפח כלי הדם בגלל זרימת הדם (בעיקר בכלי דם עורקיים), ויהיו דבוקים למקום שבו נוצר הנזק (למעט מקרה של תסחיף). קריש פוסט-מורטלי יהיה בצורת כלי הדם מכיוון שהדם לא זורם ויש לו זמן להיקרש עד שהוא ממלא את נפח כלי הדם. בנוסף, קריש פוסטמורטלי נתלש די בקלות מכיוון שהוא לא נוצר מנזק לאנדותל ולכן לא \"דבוק\" אליו. בנוסף, קריש פוסט-מורטלי לרוב יהיה בעל מראה חלק ומבריק (ולא \"גס\"\\\"מגורגר\").", "cmp": ""}, {"id": "c2-64", "en": "Chicken fat clot", "he": "-", "mean": "מקרה פרטי של קריש פוסט-מורטלי (נוצר לאחר המוות), שבו הקריש מחולק לשתי פאזות – בהירה וכהה. האריטרוציטים שוקעים מהר מאוד ומשאירים פאזה אדומה בתחתית, ופאזה עליונה שמכילה בעיקר נוזל סרום עם חלבונים. אריתרוציטים דוחים אחד את השני כי הם בעלי מטען שלילי, אבל במצבים בדם שיש חלבונים נוספים שנדבקים לאריתרוציטים ומבטלים את המטען החשמלי שלהם, ולפעמים אף גורמים ליצירת קשר בין האריתרוציטים, נראה שקיעה מהירה שלהם בקרישי הדם וחלוקה לשתי פאזות.", "cmp": ""}, {"id": "c2-65", "en": "Bile imbibition", "he": "-", "mean": "ממצא פוסט מורטלי בו נוזל המרה מפעפע לאחר המוות וצובע את הכבד והרקמות מסביב בצבע ירוק.", "cmp": ""}, {"id": "c2-66", "en": "Rigor mortis", "he": "קישיון שרירים / צפידת המוות", "mean": "קישיון השרירים ונעילת המפרקים לאחר המוות, לרוב באקסטנציה בגפיים אבל לא בהכרח. כדי לפרק את הקשר בין אקטין למיוזין בשרירים צריך ATP, אך לאחר המוות נגמר הATP בתא. כתוצאה מכך אי אפשר לפרק את הקשר ויש קישיון של השרירים. לאחר המוות התאים מתפרקים ועוברים אוטוליזה בערך 2-6 שעות לאחר המוות, התהליך מגיע לשיא 24-48 לאחר המוות, וחולף לאחר 24-48 שעות נוספות. לכן נצפה שאפקט קישיון השרירים יסתיים בערך 3-4 ימים לאחר המוות.", "cmp": ""}]}, {"id": 3, "title": "אדפטציה תאית", "terms": [{"id": "c3-0", "en": "Cellular Adaptation", "he": "אדפטציה תאית", "mean": "אם הנזק לתאים, הוא לא חמור במיוחד או לטלי שגורם למוות שלהם, התאים יכולים להתאים את עצמם כדי לשרוד. התוצאה של ההתאמות הללו יכולה להיות חיובית לבע\"ח אך לפעמים יכולה להיות גם שלילית.", "cmp": ""}, {"id": "c3-1", "en": "Cell cycle", "he": "מחזור התא", "mean": "סדרת שלבים שכל תא עובר כדי להתחלק: אינטרפאזה (G₁, S, G₂), מיטוזה (M) ומצב \"רדום\" G₀; מבוקר על‑ידי נקודות בקרה (checkpoints).", "cmp": ""}, {"id": "c3-2", "en": "Senescence", "he": "זקנה תאית\\ \"תאיות סנסנציה\"", "mean": "עצירה בלתי‑הפיכה של חלוקת התא למשל בעקבות פגיעה מצטברת או קיצור טלומרים; תאים נשארים בחיים אך אינם מתחלקים, ותורמים להזדקנות רקמות.", "cmp": ""}, {"id": "c3-3", "en": "Hypertrophy", "he": "היפרטרופיה", "mean": "הגדלה בנפח התא (ולכן של האיבר) עקב ייצור (יתר) של אברונים, כתגובה לעומס מוגבר או גירוי הורמונלי רק ברקמות שאינן מתחלקות.", "cmp": ""}, {"id": "c3-4", "en": "Hyperplasia", "he": "היפרפלזיה", "mean": "עלייה במספר התאים ברקמה בעקבות טריגר - גירוי הורמונלי או ציטוקיני, מיקרואורגניזם (זיהומיים וויראליים למשל), או תזונה לקויה.; רק ברקמות עם יכולת חלוקה; לרוב הפיך עם הפסקת הגירוי.\nהתאים נשארים ממויינים - אין שונות מורפולוגית, נשארים במראה נורמלי או כמעט נורמלי בהיסטולוגיה.", "cmp": ""}, {"id": "c3-5", "en": "Nodular hyperplasia", "he": "היפרפלזיה נודולרית", "mean": "אידיופטית, על רקע הגיל (לא יודעים למה בדיוק זה קורה). מניחים שעם הגיל יש אובדן פונקציונליות ואולי זה נסיון לפצות, הבעיה היא שהמבנה של הנודולים לא לגמרי תקין ולכן פעילותם אינה תקינה כמו רקמה נורמלית.", "cmp": ""}, {"id": "c3-6", "en": "Hypoplasia", "he": "היפופלזיה", "mean": "האיבר לא התפתח לגודל הנורמלי\\תקין", "cmp": ""}, {"id": "c3-7", "en": "Metaplasia", "he": "מטפלזיה", "mean": "שינוי של רקמות או תאים ממוינים מסוג אחד לסוג ממויין אחר. הרקמה יותר עמידה בפני סטרס / גירוי כרוני, אך פחות תפקודי - התפקוד המקורי שלו ייפגע ככל הנראה.\nבתיאוריה התהליך הפיך, אך בפועל מקרים רבים אינם הפיכים.", "cmp": ""}, {"id": "c3-8", "en": "Dysplasia", "he": "דיספלזיה", "mean": "התאים ברקמה מאבדים את ההתמיינות התקינה: מציגים שינויים מורפולוגיים אבנורמליים (Atypia), ללא סידור תקין (\"בלאגן\"), ללא הגיון מבני. לא תמיד יודעים מה הטריגר/הגורם לשינויים מטאפלסטיים. \n\n** דיספלזיה בהקשר של מחלות התפתחותיות, דיספלזיה כזו לא מדברת על תאים, אלא על מבנים שלמים שלא מתפתחים כמו שצריך, זה לא שהתאים הם אב-נורמליים (אין Atypia), אלא זה המבנה של המפרק שהוא אב-נורמלי", "cmp": ""}, {"id": "c3-9", "en": "Atrophy", "he": "אטרופיה", "mean": "התאים מתכווצים\\קטנים בגודלם על ידי פירוק איברונים בתא.\nברמת האיבר - יכול להתרחש ביחד עם מוות תאים מתוכנן (אפופטוזיס) שגורם לירידה גם במספר התאים ובהתאם בנפח האיבר.", "cmp": ""}, {"id": "c3-10", "en": "Autophagy", "he": "אוטופגיה", "mean": "פירוק עצמי של התא לצורך מחזור רכיבים תוך-תאיים פגומים או לא נחוצים.", "cmp": ""}, {"id": "c3-11", "en": "Preneoplastic changes", "he": "שינויים פרה-נאופלסטיים", "mean": "מצבים של חוסר יציבות גנטית (לדוגמה דיספלזיה) לכאורה הפיכים, אך בסיכון להתמרה סרטנית (Malignant transformation)", "cmp": ""}, {"id": "c3-12", "en": "Intracellular accumulations", "he": "הצטברויות תוך‑תאיות", "mean": "הצטברות תוך תאית (גם ציטופלסמה, גרעין) של חומרים אנדוגניים או אקסוגניים - שומנים(ליפידים), סוכרים (גליקוגן) חלבונים ועוד.", "cmp": ""}, {"id": "c3-13", "en": "Lipidosis", "he": "ליפידוזיס", "mean": "תאי המקור של האיבר או הרקמה צוברים בתוך התא עצמו שומן\n(התאים מתחילים לצבור ליפידים).", "cmp": ""}, {"id": "c3-14", "en": "Glycogen Accumulation", "he": "צבירת גליקוגן (שמות אחרים רלוונטיים למחלות מסוימות)", "mean": "צבירת גליקוגן - בכבד (שכיח יותר)", "cmp": ""}, {"id": "c3-15", "en": "Protein accumulation", "he": "צבירת חלבונים", "mean": "צבירה של חלבונים בתאים", "cmp": ""}, {"id": "c3-16", "en": "Extracellular accumulations", "he": "הצטברויות חוץ‑תאיות", "mean": "הצטברויות (ברקמות) של חלבונים, פחמימות, שומן וכו'", "cmp": ""}, {"id": "c3-17", "en": "Fatty infiltration", "he": "חדירת תאים שומניים", "mean": "חדירת תאים שומניים (אדיפוציטים) ממוינים לתוך רקמות.", "cmp": ""}, {"id": "c3-18", "en": "Amyloidosis", "he": "עמילואידוזיס", "mean": "הצטברות חלבון עמילואיד במטריקס החוץ‑תאי – בעקבות מבנה שאיננו תקין (הוא לא מתקפל, הוא לא מתפקד - Misfolded protein) הוא מצטבר בגוף וכשהגוף לא יודע איך להיפטר ממנו, הוא שוקע ברקמות.", "cmp": ""}, {"id": "c3-19", "en": "Gout", "he": "שיגדון", "mean": "הצטברות של אורטים (Urates) בדם ושקיעה שלהם ברקמות- מחלה של פרימטים (כולל בני אדם), זוחלים ועופות", "cmp": ""}, {"id": "c3-20", "en": "Pigments", "he": "פיגמנטים", "mean": "חומרים בעלי צבע שנמצאים בתוך או מחוץ לתאים, אשר יכולים להיות אנדוגניים (מיוצרים בגוף) או אקסוגניים (ממקור חיצוני), ומשקפים מצבים פיזיולוגיים או פתולוגיים.", "cmp": ""}, {"id": "c3-21", "en": "Melanosis", "he": "מלנוזיס", "mean": "פיגמנטציה שחורה של איברים כדוגמת ריריות חלל הפה, הלשון והריאות.", "cmp": ""}, {"id": "c3-22", "en": "Hemolysis", "he": "המוליזה (מואצת)", "mean": "פירוק מוגבר (פתולוגי) של תאי דם אדומים (אריתרוציטים)", "cmp": ""}, {"id": "c3-23", "en": "Hemoglobin imbibition", "he": "צבירה פוסט מורטאלית (אחרי המוות) של המוגלובין", "mean": "צביעה אדומה אחרי המוות של סרוזות ואיברים.", "cmp": ""}, {"id": "c3-24", "en": "Cyanosis", "he": "כיחלון", "mean": "חוסר בדם מחומצן - בהמוגלובין לא מחומצן נקבל צבע סגלגל (Deoxyhemoglobin)", "cmp": ""}, {"id": "c3-25", "en": "Hemosiderin", "he": "אגירת ברזל ברקמות", "mean": "מאקרופאגים רקמתיים או מגיעים מזרם הדם בולעים את האריתרוציטים (Eryhtrophagocytosis) ואוגרים את הברזל מההמוגלובין כחלבון אגירה שנקרא המוסידרין Hemosiderin.", "cmp": ""}, {"id": "c3-26", "en": "Icterus", "he": "צהבת", "mean": "רקמות נצבעות בגוונים שונים של צהוב (כתלות בחומרה ובזמן) - בדר\"כ רקמות שאין להן צבע, כמו ריריות, סרוזות, רקמת שומן, אינטימה של כלי דם (השכבה הפנימית), רקמות שאין להן צבע עז אפריורית.", "cmp": ""}, {"id": "c3-27", "en": "Pathologic calcification", "he": "הצטברות סידן פתולוגית", "mean": "הסתיידות/קלסיפיקציה של רקמות - \n\n* Gross - להסתיידות יש בדר\"כ צבע לבן אטום ומרקם מחוספס (Gritty texture). \n* בהיסטולוגיה: הסידן ב-H&E בדר\"כ נצבע בסגול ע\"י המטוקסילין והוא יהיה באזופילי ומגורגר. לפעמים מתבלבלים בינו לבין חיידקים, לחיידקים יש גודל אחיד ולהסתיידות לא.", "cmp": ""}]}, {"id": 4, "title": "שינויים המודינמיים", "terms": [{"id": "c4-0", "en": "Hemodynamic changes", "he": "שינויים המודינמיים", "mean": "הפרעות באספקת הדם", "cmp": ""}, {"id": "c4-1", "en": "Hemorrhage", "he": "דימום", "mean": "יציאה של כל מרכיבי הדם מהדם (כולל בין היתר נוזל הפלסמה, חלבונים, טסיות, תאי דלקת ואריתרוציטים)", "cmp": ""}, {"id": "c4-2", "en": "Acute hemorrhage", "he": "דימום אקוטי", "mean": "דימום מהיר", "cmp": ""}, {"id": "c4-3", "en": "Chronic hemorrhage", "he": "דימום כרוני", "mean": "דימום איטי", "cmp": ""}, {"id": "c4-4", "en": "Patechiae", "he": "פטכיות", "mean": "דימומים קטנים מאוד, 1-2 מ\"מ קוטר", "cmp": ""}, {"id": "c4-5", "en": "Ecchymosis", "he": "אכימוזות", "mean": "דימומים יותר גדולים", "cmp": ""}, {"id": "c4-6", "en": "Paint brush hemorrhage", "he": "", "mean": "דימום ארוכים\\לינאריים (כדמוי משיכת מברשת עם צבע)", "cmp": ""}, {"id": "c4-7", "en": "Suffusive hemorrhage", "he": "", "mean": "דימום שופע וחמור יותר באופן יחסי", "cmp": ""}, {"id": "c4-8", "en": "Hematoma", "he": "שתף דם", "mean": "הצטברות מקו
